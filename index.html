<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get thee to a Nunnery</title>
<style>
html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none}
canvas#c{position:absolute;left:0;top:0;display:block;cursor:none;touch-action:none}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
'use strict';
// =====================================================================
// GET THEE TO A NUNNERY  -  single-file jam build
// Sections: CONFIG  UTIL  INPUT  AUDIO  SPRITES  FX  ENTITIES  WAVES
//           BLESSINGS  STATES  DEBUG  MAIN
// =====================================================================

// ===================================================================== CONFIG
// Every tuning number lives here and nowhere else.
const CONFIG = {
  W: 960, H: 540, TICK: 1 / 60, MAX_STEPS: 5, DT_CLAMP: 0.1, DPR_CAP: 2,
  BORDER: 16,
  // nun
  NUN_SPEED: 170, NUN_R: 11, FRICTION: 0.85,
  HEARTS: 3, MAX_HEARTS: 5, IFRAMES: 1.0, HURT_SHOVE_PX: 60, HURT_SLOWMO: 0.25, HURT_SLOWMO_T: 0.2,
  // shotgun
  PELLETS: 8, SPREAD_DEG: 22, PELLET_SPEED: 1100, PELLET_LIFE: 0.22, PELLET_FULL_T: 0.13, PELLET_R: 2.5,
  PELLET_SPEED_JITTER: 0.08, // +/- per pellet: a spray, not a comb of parallel tracers
  PUMP_T: 0.42, SHELLS: 4, SHELL_T: 0.35, PUMP_SFX_AT: 0.7, FIRE_BUFFER_T: 0.10,
  RECOIL_PX: 40, KNOCK_PX: 120, FLY_SPEED: 80, SPLAT_SPEED: 200, SPLAT_DMG: 3,
  TRANSFER: 0.3, TRANSFER_DAMP: 0.9, CORPSE_TRANSFER: 1.0, // ripple: fliers hand on 30%, a dying body hands on 100%
  MUZZLE_OFF: 30, GUN_LEN: 34,
  // camera and hitstop
  SHAKE_FIRE_PX: 9, SHAKE_FIRE_T: 0.12, KICK_PX: 8, KICK_DECAY: 14,
  HITSTOP_KILL: 3, HITSTOP_MULTI: 4, HITSTOP_CAP: 5, MULTI_KILLS: 3,
  // score
  COMBO_T: 1.5, COMBO_STEP: 0.1, COMBO_MAX: 5,
  // budgets
  PARTICLES: 500, MAX_ENEMIES: 80, MAX_PELLETS: 120, MAX_TEXTS: 20, MAX_CASINGS: 40, MAX_PICKUPS: 30,
  CHUNKS: 8, CONFETTI: 10, CHUNK_DRAG: 0.94, CONFETTI_DRAG: 0.96, DECAL_ALPHA: 0.35,
  // audio bus + the blast envelope (the one sound that has to be the loudest thing in the game)
  COMP_THRESH: -8, COMP_RATIO: 4, COMP_ATTACK: 0.003, COMP_RELEASE: 0.12, COMP_KNEE: 6,
  BLAST_NOISE_DUR: 0.30, BLAST_NOISE_SWEEP: 0.16, BLAST_SINE_DUR: 0.30, BLAST_SINE_PEAK: 1.3, BLAST_TRI_DUR: 0.26,
  // waves: budget 8+4n spent in bursts from the gates, one telegraph per burst
  WAVE_BASE: 8, WAVE_PER: 4, BOSS_WAVE: 10, WAVE_SPEED_PER: 0.03,
  BURSTS_PER_WAVE: 10, BURST_FIRST: 0.8, BURST_MIN: 2, BURST_MAX: 3,
  TELEGRAPH_T: 0.5, GATE_IN: 34, GATE_JITTER: 16, BOSS_GATE_IN: 74,
  COST_RESTLESS: 1, COST_YORICK_PACK: 3, COST_GRAVEDIGGER: 6, COST_GHOST: 5,
  WAVE_YORICK: 3, WAVE_GRAVEDIGGER: 5, WAVE_GHOST: 6,
  PACK_MIN: 8, PACK_MAX: 12, PACK_SPREAD: 26, WOBBLE_AMP: 0.55, WOBBLE_FREQ: 6,
  WAVE_END_SLOWMO: 0.3, WAVE_END_T: 0.4, WAVE_CARD_T: 1.4, WAVE_BONUS: 100, ENCORE_STEP: 0.1,
  BOSS_WIN_SLOWMO: 0.22, BOSS_WIN_T: 1.2, BOSS_BAR_W: 420, RETRY_LOCK: 0.25,
  // pickups
  HEART_HEAL: 1, HEART_R: 10, HEART_LIFE: 14, HEART_BLINK: 3,
  // debug drip spawner (GAME.debugSpawn only; the wave system owns the real spawns)
  SPAWN_EVERY: 2, SPAWN_N: 2,
};

const PAL = {
  floor: '#1b1f3a', stone: '#151830', border: '#5a6078', amber: '#ffb347',
  green: '#7bd389', greenShade: '#4f9a5c', bone: '#f4f0e6', cyan: '#8fe3ff',
  muzzle: '#fff3c4', cream: '#f4f0e6', purple: '#7b3fa0', gold: '#ffd166', brass: '#d9a441',
  black: '#111118', outline: '#0b0b12', skin: '#f1c9a5', red: '#c0392b', smoke: '#8a8fa8',
};
const FONT_SERIF = 'bold Georgia, "Times New Roman", serif';
const FONT_SANS = 'bold -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif';
const VERSION = '0.4.0-m4';

// ===================================================================== UTIL
const TAU = Math.PI * 2;
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const randi = (n) => Math.floor(Math.random() * n);
const pick = (arr) => arr[randi(arr.length)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const fmt = (n) => Math.round(n || 0).toLocaleString('en-US');
// normalise; zero-length vectors return a safe unit x so nothing ever goes NaN
function norm(x, y) { const d = Math.hypot(x, y); return d > 1e-6 ? [x / d, y / d, d] : [1, 0, 0]; }
function font(px, serif) { return px + 'px ' + (serif ? FONT_SERIF : FONT_SANS); }
function text(c, str, x, y, px, color, align = 'center', serif = false, base = 'middle') {
  c.font = font(px, serif); c.fillStyle = color; c.textAlign = align; c.textBaseline = base; c.fillText(str, x, y);
}
function makeCanvas(w, h) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; return cv; }

// canvas + letterbox viewport
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const View = { scale: 1, offsetX: 0, offsetY: 0, dpr: 1 };
function resize() {
  const iw = window.innerWidth || CONFIG.W, ih = window.innerHeight || CONFIG.H;
  const s = Math.min(iw / CONFIG.W, ih / CONFIG.H);
  View.scale = s; View.dpr = Math.min(window.devicePixelRatio || 1, CONFIG.DPR_CAP);
  const cw = CONFIG.W * s, ch = CONFIG.H * s;
  View.offsetX = Math.floor((iw - cw) / 2); View.offsetY = Math.floor((ih - ch) / 2);
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  canvas.style.left = View.offsetX + 'px'; canvas.style.top = View.offsetY + 'px';
  canvas.width = Math.max(1, Math.round(cw * View.dpr)); canvas.height = Math.max(1, Math.round(ch * View.dpr));
  Input.refreshMouse();
}
window.addEventListener('resize', resize);

// persistence: localStorage with an in-memory fallback, never throws
const Save = (() => {
  const KEY = 'nunnery.v1';
  const def = () => ({ hi: 0, bestWave: 0, kills: 0, runs: 0, wins: 0, unlocks: [], mute: false });
  let data = def();
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const o = JSON.parse(raw); const d = def(); for (const k in d) if (o && typeof o[k] === typeof d[k]) d[k] = o[k]; data = d; }
    } catch (e) { data = def(); }
    return data;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* private mode / quota: keep in memory */ } }
  return { get data() { return data; }, load, save };
})();

// ===================================================================== INPUT
// Listeners on window so aim works over the letterbox bars and CDP-dispatched events land without focus.
const Input = (() => {
  const keys = new Set(), justPressed = new Set();
  const mouse = { x: CONFIG.W / 2, y: CONFIG.H / 2, cx: 0, cy: 0, down: false, justDown: false };
  const PREVENT = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab']);
  function toLogical(cx, cy) { return [(cx - View.offsetX) / View.scale, (cy - View.offsetY) / View.scale]; }
  function refreshMouse() { [mouse.x, mouse.y] = toLogical(mouse.cx, mouse.cy); }
  window.addEventListener('keydown', (e) => {
    if (!keys.has(e.code)) justPressed.add(e.code);
    keys.add(e.code);
    if (PREVENT.has(e.code)) e.preventDefault();
    Audio.unlock();
  });
  window.addEventListener('keyup', (e) => { keys.delete(e.code); });
  window.addEventListener('mousemove', (e) => { mouse.cx = e.clientX; mouse.cy = e.clientY; refreshMouse(); });
  window.addEventListener('mousedown', (e) => {
    mouse.cx = e.clientX; mouse.cy = e.clientY; refreshMouse();
    if (e.button === 0) { mouse.down = true; mouse.justDown = true; }
    Audio.unlock();
  });
  window.addEventListener('mouseup', (e) => { if (e.button === 0) mouse.down = false; });
  window.addEventListener('contextmenu', (e) => e.preventDefault());
  function clear() { keys.clear(); justPressed.clear(); mouse.down = false; mouse.justDown = false; }
  window.addEventListener('blur', () => { clear(); onFocusLost(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { clear(); onFocusLost(); } });
  function endTick() { justPressed.clear(); mouse.justDown = false; }
  const pressed = (code) => justPressed.has(code);
  const held = (code) => keys.has(code);
  function axis() {
    let x = 0, y = 0;
    if (keys.has('KeyA') || keys.has('ArrowLeft')) x -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) x += 1;
    if (keys.has('KeyW') || keys.has('ArrowUp')) y -= 1;
    if (keys.has('KeyS') || keys.has('ArrowDown')) y += 1;
    return [x, y];
  }
  const anyStart = () => mouse.justDown || justPressed.has('Enter') || justPressed.has('Space');
  return { keys, justPressed, mouse, clear, endTick, pressed, held, axis, anyStart, refreshMouse };
})();

// ===================================================================== AUDIO
// All synthesized. Chain: sfx -> tanh shaper -> compressor -> master -> out. Music has its own gain into the compressor.
// Nothing here may throw into game logic: every public call is wrapped.
const Audio = (() => {
  let ac = null, sfx, shaper, comp, master, musicGain, noise;
  let muted = false;
  const recent = {};
  const MASTER = 0.8;
  function tanhCurve() { const n = 1024, c = new Float32Array(n); for (let i = 0; i < n; i++) { const x = (i / (n - 1)) * 2 - 1; c[i] = Math.tanh(x * 1.6) / Math.tanh(1.6); } return c; }
  function build() {
    master = ac.createGain(); master.gain.value = muted ? 0 : MASTER;
    comp = ac.createDynamicsCompressor();
    comp.threshold.value = CONFIG.COMP_THRESH; comp.ratio.value = CONFIG.COMP_RATIO; comp.attack.value = CONFIG.COMP_ATTACK; comp.release.value = CONFIG.COMP_RELEASE; comp.knee.value = CONFIG.COMP_KNEE;
    shaper = ac.createWaveShaper(); shaper.curve = tanhCurve(); shaper.oversample = 'none';
    sfx = ac.createGain(); sfx.gain.value = 0.7; // headroom: only stacked blasts drive the shaper into grit
    sfx.connect(shaper); shaper.connect(comp); comp.connect(master); master.connect(ac.destination);
    musicGain = ac.createGain(); musicGain.gain.value = 0.25; musicGain.connect(comp);
    noise = ac.createBuffer(1, Math.floor(ac.sampleRate * 2), ac.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function unlock() {
    try {
      if (!ac) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; ac = new AC(); build(); }
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { /* audio is optional */ }
  }
  function ready() { return !!ac && ac.state === 'running' && !muted; }
  // voice cap: at most 4 of a sound per 50 ms; stacked instances get a little louder instead
  function voice(name) {
    if (!ready()) return 0;
    const now = ac.currentTime, arr = recent[name] || (recent[name] = []);
    while (arr.length && now - arr[0] > 0.05) arr.shift();
    if (arr.length >= 4) return 0;
    arr.push(now);
    return 1 + arr.length * 0.12;
  }
  const jit = () => 1 + (Math.random() - 0.5) * 0.12;
  function env(g, t0, peak, dur) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(Math.max(0.0002, peak), t0 + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  }
  // o = { type, f0, f1, sweep, dur, peak, t }
  function osc(o) {
    const t0 = o.t, s = ac.createOscillator(); s.type = o.type || 'sine';
    s.frequency.setValueAtTime(Math.max(1, o.f0), t0);
    if (o.f1 !== undefined && o.f1 !== o.f0) s.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t0 + (o.sweep || o.dur));
    const g = ac.createGain(); env(g, t0, o.peak, o.dur);
    s.connect(g); g.connect(o.dest || sfx); s.start(t0); s.stop(t0 + o.dur + 0.03);
  }
  // n = { t, dur, peak, type, f0, f1, sweep, q }
  function noiseBurst(n) {
    const t0 = n.t, s = ac.createBufferSource(); s.buffer = noise; s.loop = true; s.playbackRate.value = jit();
    s.loopStart = Math.random() * 1.5;
    const f = ac.createBiquadFilter(); f.type = n.type || 'bandpass'; f.Q.value = n.q || 1;
    f.frequency.setValueAtTime(Math.max(20, n.f0), t0);
    if (n.f1) f.frequency.exponentialRampToValueAtTime(Math.max(20, n.f1), t0 + (n.sweep || n.dur));
    const g = ac.createGain(); env(g, t0, n.peak, n.dur);
    s.connect(f); f.connect(g); g.connect(n.dest || sfx); s.start(t0, s.loopStart); s.stop(t0 + n.dur + 0.03);
  }
  function duck(to, back) {
    if (!musicGain) return; const t = ac.currentTime;
    musicGain.gain.cancelScheduledValues(t); musicGain.gain.setValueAtTime(musicGain.gain.value, t);
    musicGain.gain.linearRampToValueAtTime(to, t + 0.01); musicGain.gain.linearRampToValueAtTime(0.25, t + back);
  }
  // ---- sounds (filled in as the systems land)
  const S = {};
  S.click = () => { const v = voice('click'); if (!v) return; const t = ac.currentTime; osc({ type: 'sine', f0: 1200, f1: 900, dur: 0.05, peak: 0.25 * v, t }); noiseBurst({ t, dur: 0.012, peak: 0.2 * v, type: 'highpass', f0: 3000 }); };
  // THE BLAST. click transient + bandpass-swept noise + sine thump + triangle body, all jittered, then the bus shaper adds grit.
  S.blast = () => {
    const v = voice('blast'); if (!v) return; const t = ac.currentTime, j = jit();
    noiseBurst({ t, dur: 0.008, peak: 0.9 * v, type: 'highpass', f0: 3000, q: 0.7 });
    noiseBurst({ t, dur: CONFIG.BLAST_NOISE_DUR, sweep: CONFIG.BLAST_NOISE_SWEEP, peak: 1.1 * v, type: 'bandpass', f0: 1800 * j, f1: 250 * j, q: 1.2 });
    osc({ type: 'sine', f0: 120 * j, f1: 38 * j, sweep: 0.09, dur: CONFIG.BLAST_SINE_DUR, peak: CONFIG.BLAST_SINE_PEAK * v, t });
    osc({ type: 'triangle', f0: 55 * j, f1: 45 * j, sweep: 0.1, dur: CONFIG.BLAST_TRI_DUR, peak: 0.5 * v, t });
    duck(0.08, 0.35);
  };
  // chk-chk: two filtered clicks 90 ms apart, the second lower = "ready"
  S.pump = () => {
    const v = voice('pump'); if (!v) return; const t = ac.currentTime, j = jit();
    noiseBurst({ t, dur: 0.035, peak: 0.55 * v, type: 'bandpass', f0: 2600 * j, q: 2.5 });
    osc({ type: 'square', f0: 900 * j, f1: 600 * j, dur: 0.04, peak: 0.12 * v, t });
    const t2 = t + 0.09;
    noiseBurst({ t: t2, dur: 0.045, peak: 0.6 * v, type: 'bandpass', f0: 1500 * j, q: 2.5 });
    osc({ type: 'square', f0: 620 * j, f1: 380 * j, dur: 0.06, peak: 0.14 * v, t: t2 });
  };
  S.shellIn = () => { const v = voice('shell'); if (!v) return; const t = ac.currentTime, j = jit(); noiseBurst({ t, dur: 0.025, peak: 0.35 * v, type: 'bandpass', f0: 1200 * j, q: 1.5 }); osc({ type: 'sine', f0: 520 * j, f1: 340 * j, dur: 0.04, peak: 0.18 * v, t }); };
  S.tink = () => { const v = voice('tink'); if (!v) return; const t = ac.currentTime, j = jit(); osc({ type: 'sine', f0: 3200 * j, f1: 2600 * j, dur: 0.07, peak: 0.12 * v, t }); osc({ type: 'sine', f0: 4800 * j, f1: 4100 * j, dur: 0.04, peak: 0.05 * v, t }); };
  S.hit = () => { const v = voice('hit'); if (!v) return; const t = ac.currentTime, j = jit(); osc({ type: 'square', f0: 220 * j, f1: 90 * j, dur: 0.06, peak: 0.28 * v, t }); noiseBurst({ t, dur: 0.02, peak: 0.25 * v, type: 'bandpass', f0: 1400 * j, q: 1 }); };
  // one death sound pitched by mass: Yorick tok (0.5), Restless splat (1), Gravedigger thud (4)
  S.death = (mass = 1) => {
    const v = voice('death'); if (!v) return; const t = ac.currentTime, j = jit(), k = Math.sqrt(Math.max(0.25, mass));
    noiseBurst({ t, dur: 0.16 * k, sweep: 0.12 * k, peak: 0.7 * v, type: 'lowpass', f0: (900 / k) * j, f1: (120 / k) * j, q: 1 });
    osc({ type: 'sine', f0: (170 / k) * j, f1: (45 / k) * j, sweep: 0.1 * k, dur: 0.16 * k, peak: 0.6 * v, t });
    if (mass < 0.75) osc({ type: 'triangle', f0: 1400 * j, f1: 500 * j, dur: 0.04, peak: 0.3 * v, t });
  };
  S.thud = () => { const v = voice('thud'); if (!v) return; const t = ac.currentTime, j = jit(); osc({ type: 'sine', f0: 95 * j, f1: 32 * j, sweep: 0.12, dur: 0.22, peak: 0.9 * v, t }); noiseBurst({ t, dur: 0.14, sweep: 0.1, peak: 0.5 * v, type: 'lowpass', f0: 600 * j, f1: 150 * j, q: 1 }); };
  // dissonant organ stab + two heartbeats
  S.hurt = () => {
    const v = voice('hurt'); if (!v) return; const t = ac.currentTime;
    osc({ type: 'sawtooth', f0: 220, f1: 200, sweep: 0.3, dur: 0.35, peak: 0.22 * v, t });
    osc({ type: 'sawtooth', f0: 233, f1: 215, sweep: 0.3, dur: 0.35, peak: 0.22 * v, t });
    osc({ type: 'sine', f0: 70, f1: 45, dur: 0.12, peak: 0.6 * v, t: t + 0.05 });
    osc({ type: 'sine', f0: 70, f1: 45, dur: 0.12, peak: 0.5 * v, t: t + 0.3 });
  };
  S.bell = (mult = 1) => {
    const v = voice('bell'); if (!v) return; const t = ac.currentTime, f = 660 * mult;
    osc({ type: 'sine', f0: f, dur: 1.4, peak: 0.35 * v, t }); osc({ type: 'sine', f0: f * 2.01, dur: 0.9, peak: 0.15 * v, t }); osc({ type: 'sine', f0: f * 2.98, dur: 0.5, peak: 0.08 * v, t });
  };
  function toggleMute() {
    muted = !muted; Save.data.mute = muted; Save.save();
    try { if (master) master.gain.setTargetAtTime(muted ? 0 : MASTER, ac.currentTime, 0.02); } catch (e) { /* ignore */ }
    return muted;
  }
  function setMuted(m) { muted = !!m; try { if (master) master.gain.value = muted ? 0 : MASTER; } catch (e) { /* ignore */ } }
  // public wrappers never throw
  const api = { unlock, toggleMute, setMuted, get muted() { return muted; }, get running() { return ready(); } };
  for (const k in S) api[k] = (...a) => { try { S[k](...a); } catch (e) { /* audio must never break the game */ } };
  api._S = S; api._osc = osc; api._noise = noiseBurst; api._voice = voice; api._duck = duck; api._jit = jit; api._ctx = () => ac;
  return api;
})();

// ===================================================================== SPRITES
// Placeholder procedural shapes. Task 6 replaces these with the Designer's recipes, pre-rendered at boot.
function drawShadow(c, x, y, rx, ry) { c.fillStyle = 'rgba(0,0,0,0.35)'; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU); c.fill(); }

function drawNun(c, p) {
  const x = p.x, y = p.y, feetY = y + 14;
  drawShadow(c, x, feetY, 13, 4);
  c.save();
  c.translate(x, feetY);
  // lean into recoil, squash/stretch on fire
  const lean = clamp(p.kvx / 900, -0.35, 0.35);
  c.rotate(lean);
  const st = p.stretch || 0;
  c.scale((1 + st * 0.18) * (p.facing < 0 ? -1 : 1), 1 - st * 0.14);
  c.translate(-x, -feetY);
  c.lineWidth = 2; c.strokeStyle = PAL.outline;
  // habit: bell shape
  c.fillStyle = PAL.black;
  c.beginPath();
  c.moveTo(x - 6, y - 4); c.lineTo(x + 6, y - 4);
  c.quadraticCurveTo(x + 10, y + 6, x + 11, feetY);
  c.lineTo(x - 11, feetY);
  c.quadraticCurveTo(x - 10, y + 6, x - 6, y - 4);
  c.closePath(); c.fill(); c.stroke();
  // scapular strip + cross
  c.fillStyle = PAL.bone; c.fillRect(x - 2.5, y - 3, 5, 12);
  c.fillStyle = PAL.gold; c.fillRect(x - 0.9, y + 1, 1.8, 6); c.fillRect(x - 2.5, y + 2.6, 5, 1.8);
  // veil behind head
  c.fillStyle = PAL.black; c.beginPath(); c.ellipse(x, y - 8, 10.5, 11, 0, 0, TAU); c.fill(); c.stroke();
  // coif ring (the silhouette) then face
  c.fillStyle = PAL.bone; c.beginPath(); c.arc(x, y - 9, 8, 0, TAU); c.fill(); c.stroke();
  c.fillStyle = PAL.skin; c.beginPath(); c.arc(x, y - 8.5, 5.2, 0, TAU); c.fill();
  c.fillStyle = PAL.outline; c.fillRect(x - 3, y - 10, 1.6, 2); c.fillRect(x + 1.4, y - 10, 1.6, 2);
  // shoes
  c.fillStyle = PAL.outline; c.fillRect(x - 7, feetY - 2, 5, 2.5); c.fillRect(x + 2, feetY - 2, 5, 2.5);
  c.restore();
}

function drawGun(c, p) {
  const hx = p.x + p.facing * 2, hy = p.y - 1;
  c.save();
  c.translate(hx, hy); c.rotate(p.aim);
  const back = -(p.gunKick || 0);
  c.translate(back, 0);
  c.lineWidth = 2; c.strokeStyle = PAL.outline;
  // stock
  c.fillStyle = '#6b3f23'; c.fillRect(-10, -2.5, 14, 5); c.strokeRect(-10, -2.5, 14, 5);
  // barrel

    const i = cursor; cursor = (cursor + 1) % N;

  }

      const a = opts.angle !== undefined ? opts.angle + (Math.random() - 0.5) * (opts.arc || TAU) : Math.random() * TAU;
      const sp = rand(opts.minSpeed || 40, opts.maxSpeed || 200);
      spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp, rand(opts.minLife || 0.3, opts.maxLife || 0.7), Array.isArray(opts.color) ? pick(opts.color) : opts.color, rand(opts.minSize || 2, opts.maxSize || 4), opts.grav || 0, opts.drag || 0.92);
    }
  }
  function update(dt) {

  }

  const cam = { shakeT: 0, shakeDur: 0.12, shakeAmp: 0, kickX: 0, kickY: 0, x: 0, y: 0, rot: 0 };
  function shake(pxAmp, dur = CONFIG.SHAKE_FIRE_T) { cam.shakeAmp = Math.max(cam.shakeAmp * (cam.shakeT / cam.shakeDur), pxAmp); cam.shakeT = cam.shakeDur = dur; }

  function flash(x, y, angle) { flashes.push({ x, y, angle, t: 0 }); }

      cam.x = (Math.random() * 2 - 1) * a; cam.y = (Math.random() * 2 - 1) * a; cam.rot = (Math.random() * 2 - 1) * a * 0.004;

    }

    glowBlob = makeCanvas(128, 128);
    { const g = glowBlob.getContext('2d'); const gr = g.createRadialGradient(64, 64, 4, 64, 64, 64); gr.addColorStop(0, 'rgba(255,243,196,0.9)'); gr.addColorStop(0.35, 'rgba(255,179,71,0.45)'); gr.addColorStop(1, 'rgba(255,179,71,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); }
    vignette = makeCanvas(CONFIG.W, CONFIG.H);
    { const g = vignette.getContext('2d'); const gr = g.createRadialGradient(CONFIG.W / 2, CONFIG.H / 2, CONFIG.H * 0.45, CONFIG.W / 2, CONFIG.H / 2, CONFIG.W * 0.72); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.55)'); g.fillStyle = gr; g.fillRect(0, 0, CONFIG.W, CONFIG.H); }
    redVignette = makeCanvas(CONFIG.W, CONFIG.H);
    { const g = redVignette.getContext('2d'); const gr = g.createRadialGradient(CONFIG.W / 2, CONFIG.H / 2, CONFIG.H * 0.3, CONFIG.W / 2, CONFIG.H / 2, CONFIG.W * 0.65); gr.addColorStop(0, 'rgba(192,57,43,0)'); gr.addColorStop(1, 'rgba(192,57,43,0.9)'); g.fillStyle = gr; g.fillRect(0, 0, CONFIG.W, CONFIG.H); }

        c.beginPath(); c.arc(4, 0, 9, 0, TAU); c.fill();

})();

// Floor: persistent offscreen canvas at 2x. Flagstones drawn once; decals and stopped casings stamped onto it.
const Floor = (() => {
  const S = 2; let cv, fc;

    cv = makeCanvas(CONFIG.W * S, CONFIG.H * S); fc = cv.getContext('2d'); fc.setTransform(S, 0, 0, S, 0, 0);
    fc.fillStyle = PAL.floor; fc.fillRect(0, 0, CONFIG.W, CONFIG.H);
    fc.strokeStyle = PAL.stone; fc.lineWidth = 2;
    const cw = 48, ch = 32;

    fc.strokeStyle = '#3d4257'; fc.lineWidth = 2; fc.strokeRect(CONFIG.BORDER, CONFIG.BORDER, CONFIG.W - CONFIG.BORDER * 2, CONFIG.H - CONFIG.BORDER * 2);

    fc.globalAlpha = 1;

})();

function newPlayer() {

function updatePlayer(dt) {
  const p = G.player;
  // aim
  const [ax, ay, ad] = norm(Input.mouse.x - p.x, Input.mouse.y - p.y);
  p.aimX = ax; p.aimY = ay; p.aimDist = ad; p.aim = Math.atan2(ay, ax); p.facing = ax < 0 ? -1 : 1;
  // move + knock
  const [mx, my] = Input.axis(); const moving = mx !== 0 || my !== 0; const [nx, ny] = norm(mx, my);
  p.moving = moving; if (moving) p.walkT += dt;
  p.x += ((moving ? nx * CONFIG.NUN_SPEED : 0) + p.kvx) * dt;
  p.y += ((moving ? ny * CONFIG.NUN_SPEED : 0) + p.kvy) * dt;
  p.kvx *= CONFIG.FRICTION; p.kvy *= CONFIG.FRICTION;
  // clamp to the arena; kill knock velocity into the wall
  const B = CONFIG.BORDER + p.r;
  if (p.x < B) { p.x = B; if (p.kvx < 0) p.kvx = 0; } else if (p.x > CONFIG.W - B) { p.x = CONFIG.W - B; if (p.kvx > 0) p.kvx = 0; }
  if (p.y < B) { p.y = B; if (p.kvy < 0) p.kvy = 0; } else if (p.y > CONFIG.H - B) { p.y = CONFIG.H - B; if (p.kvy > 0) p.kvy = 0; }
  if (p.iframes > 0) p.iframes -= dt;
  p.stretch *= 0.82; p.gunKick *= 0.78; p.gunSlide *= 0.8;
  updateGun(dt);
}

// gun state machine: READY / PUMPING / LOADING. Hold LMB to fire at pump rate; a shot is allowed mid-reload the moment one shell is in.
function updateGun(dt) {
  const p = G.player, g = p.gun, s = p.stats;
  // a button already held when PLAYING begins (title click, card pick) must not fire until released once
  if (!Input.mouse.down) g.holdBlock = false;
  // a tap in the last FIRE_BUFFER_T of the pump (or of the shell going in) is remembered and fires the instant the gun is ready
  if (Input.mouse.justDown && g.state !== 'READY' && g.timer <= CONFIG.FIRE_BUFFER_T) g.buffered = true;
  const wantFire = Input.mouse.justDown || (Input.mouse.down && !g.holdBlock) || g.buffered;
  if (g.state === 'READY') {

    else { g.buffered = false; if (g.shells === 0 || (Input.pressed('KeyR') && g.shells < s.shells)) { g.state = 'LOADING'; g.timer = s.shellT; } }
  } else if (g.state === 'PUMPING') {
    g.timer -= dt;
    if (!g.pumped && g.timer <= s.pumpT * (1 - CONFIG.PUMP_SFX_AT)) { g.pumped = true; p.gunSlide = 5; Audio.pump(); }
    if (g.timer <= 0) { if (g.shells === 0) { g.state = 'LOADING'; g.timer = s.shellT; } else g.state = 'READY'; }
  } else if (g.state === 'LOADING') {

    g.timer -= dt;

  const spread = (s.spread * Math.PI) / 180, n = s.pellets;
  for (let i = 0; i < n; i++) {

    const a = p.aim - spread / 2 + (spread * (i + Math.random())) / n; // stratified: one pellet jittered inside each slot
    const sp = s.pelletSpeed * (1 + rand(-CONFIG.PELLET_SPEED_JITTER, CONFIG.PELLET_SPEED_JITTER)); // a spray, not a comb of tracers
    const age0 = CONFIG.MUZZLE_OFF / sp; // life and damage falloff are measured from the nun, not the muzzle, so the range numbers hold
    G.pellets.push({ x: mx, y: my, px: mx, py: my, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, age: age0, life: s.pelletLife, full: s.fullT, r: CONFIG.PELLET_R, pierce: s.pierce, bounces: s.bounce, hit: [], shot });

  if (G.bossWave) { if (!G.bossSpawned && !G.telegraphs.length) telegraph(pick(Floor.gates()), ['claudius']); return; }

function drawGates(c) {

    const g = tg.gate, k = 1 - clamp(tg.t / CONFIG.TELEGRAPH_T, 0, 1);

    const w = horiz ? 52 : 16, h = horiz ? 16 : 52;
    c.save();
    c.globalAlpha = 0.35 + 0.5 * Math.abs(Math.sin(k * 14));
    c.fillStyle = PAL.amber; c.fillRect(g.x - w / 2, g.y - h / 2, w, h);
    c.globalAlpha = 0.5 * (1 - k);
    const [ix, iy] = gateInside(g, CONFIG.GATE_IN * k);

    c.restore();

}
function drawWaveCard(c) {

  const sc = k < 0.12 ? lerp(1.6, 1, k / 0.12) : 1;

function updateSpawner(dt) {

// ===================================================================== MAIN
function safeUpdate(dt) {
  try {
    debugKeys();
    STATES[G.state].update(dt);
  } catch (err) {
    console.error('update failed', err);
    try { if (G.state !== 'GAMEOVER') setState('GAMEOVER'); } catch (e2) { /* nothing left to do */ }
  }
  Input.endTick();
}
function draw() {
  const s = View.scale * View.dpr;
  ctx.setTransform(s, 0, 0, s, 0, 0);
  ctx.fillStyle = PAL.floor; ctx.fillRect(0, 0, CONFIG.W, CONFIG.H);
  try { STATES[G.state].draw(ctx); } catch (err) { console.error('draw failed', err); }
  drawDebug(ctx);
}
let last = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const t0 = performance.now();
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0) || dt > CONFIG.DT_CLAMP) dt = Math.min(Math.max(dt, 0), CONFIG.DT_CLAMP);
  // fps
  Perf._frames++; Perf._acc += dt; if (Perf._acc >= 0.5) { Perf.fps = Perf._frames / Perf._acc; Perf._frames = 0; Perf._acc = 0; }
  // render-time systems: shake, kick, flashes, slow-mo timer
  FX.tickRender(dt);
  if (G.slowmoT > 0) { G.slowmoT -= dt; if (G.slowmoT <= 0) G.timeScale = G.baseTimeScale; }
  // wave-end and boss-death slow-mo run on render time, so 0.4 s means 0.4 s no matter how slow the sim is
  if (G.state === 'PLAYING') {
    if (G.waveEndT > 0) { G.waveEndT -= dt; if (G.waveEndT <= 0) finishWave(); }
    else if (G.winT > 0) { G.winT -= dt; if (G.winT <= 0) finishBoss(); }
  }
  acc += dt * G.timeScale;
  let steps = 0;
  while (acc >= CONFIG.TICK && steps < CONFIG.MAX_STEPS) {
    acc -= CONFIG.TICK; steps++;
    if (G.state === 'PLAYING' && G.hitstop > 0) { G.hitstop--; continue; } // sim frozen, input buffered
    safeUpdate(CONFIG.TICK);
  }
  if (steps >= CONFIG.MAX_STEPS) acc = 0;
  draw();
  Perf.frameMs = Perf.frameMs * 0.9 + (performance.now() - t0) * 0.1;
}
function boot() {
  Save.load(); Audio.setMuted(Save.data.mute);
  G = newGame();
  FX.prerender(); Floor.build(); resize();
  setState('TITLE');
  requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });
}
boot();
</script>
</body>
