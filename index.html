const FAM_SERIF = 'Georgia, "Times New Roman", serif';
const FAM_SANS = '-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif';
// CSS shorthand wants the weight BEFORE the size, or the whole declaration is dropped
const FSERIF = (px, italic) => (italic ? 'italic ' : '') + 'bold ' + px + 'px ' + FAM_SERIF;
const FSANS = (px, regular) => (regular ? '' : 'bold ') + px + 'px ' + FAM_SANS;
const VERSION = '1.0.0-m8';

// ---------------------------------------------------------------- THE TWO OF THE ORDER
// Two playable characters, and the difference is COSMETIC: the same gun, the same stats, the same
// numbers the sim reads. A character owns its sprite key, the title the board puts in front of a
// name, and the handful of game-over quotes that name a nun out loud.
// The poster's own line. One constant: the subtitle under GET THEE TO A NUNNERY never changes, whoever
// is holding the shotgun - the characters have their own lines, and those live on the vow cards.
const TAGLINE = 'Hamlet told her where to go.';
const CHARACTERS = [
  { id: 'nun', c: 0, name: 'SISTER OPHELIA', title: 'SISTER', quotes: {} },
  {
    id: 'priest', c: 1, name: 'FATHER HORATIO', title: 'FATHER',
    quotes: { 'Goodnight, sweet nun.': 'Goodnight, padre.', 'Alas, poor Ophelia.': 'Alas, poor Horatio.' },
  },
];
// One line per card on TAKE YOUR VOWS, rolled fresh every time the screen opens.
const TAGLINES = {
  nun: [
    'Took the vows. Kept the grudge.',
    'She prays. She sprays.',
    'Get thee to a nunnery? Done.',
    'Frailty, thy name is buckshot.',
  ],
  priest: [
    'Big fan of Old Testament vengeance.',
    'Exorcises demons, one shell at a time.',
    'Officiates shotgun weddings. Literally.',
    'Turns the other cheek. Then fires.',
    'Last rites, first shot.',
  ],
};
// The last index each card showed, kept OUTSIDE G: a run rebuilds G, and the no-repeat rule is for
// the whole session. A roll never lands on the line that card is already remembered by.
const VOW_TAG_PREV = {};
function rollVowTags() {
  const out = {};
  for (const d of CHARACTERS) {
    const list = TAGLINES[d.id];
    if (!list || !list.length) { out[d.id] = 0; continue; }
    let i = randi(list.length);
    if (list.length > 1) while (i === VOW_TAG_PREV[d.id]) i = randi(list.length);
    VOW_TAG_PREV[d.id] = i; out[d.id] = i;
  }
  return out;
}
function vowTagline(id) {
  const list = TAGLINES[id];
  if (!list || !list.length) return '';
  const tag = (G && G.vowTag) || VOW_TAG_PREV;
  return list[clamp(tag[id] | 0, 0, list.length - 1)];
}
const CHAR_DEF = {};
for (const d of CHARACTERS) CHAR_DEF[d.id] = d;
function charDef(id) { return CHAR_DEF[id] || CHARACTERS[0]; }
// charId() is the SELECTION (the poster, and whoever the next run will be); G.character is the copy
// the run itself was started with, and that is what the world draws.
function charId() { return charDef(Save.data.character).id; }
function charC() { return charDef(charId()).c; }
function runCharId() { return charDef(G && G.character ? G.character : Save.data.character).id; }
function setCharId(id) {
  const d = charDef(id);
  Save.data.character = d.id; Save.save();
  if (G) G.character = d.id;
  return d.id;
}
function otherCharId() { return charId() === CHARACTERS[0].id ? CHARACTERS[1].id : CHARACTERS[0].id; }
// the priest never hears "sweet nun": one lookup, and every other line is untouched
function charQuote(q, id) { const m = charDef(id).quotes; return (m && m[q]) || q; }

// ===================================================================== UTIL
const TAU = Math.PI * 2;
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const randi = (n) => Math.floor(Math.random() * n);
const pick = (arr) => arr[randi(arr.length)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const fmt = (n) => Math.round(n || 0).toLocaleString('en-US');
// normalise; zero-length vectors return a safe unit x so nothing ever goes NaN
function norm(x, y) { const d = Math.hypot(x, y); return d > 1e-6 ? [x / d, y / d, d] : [1, 0, 0]; }
function font(px, serif) { return serif ? FSERIF(px) : FSANS(px); }
function text(c, str, x, y, px, color, align = 'center', serif = false, base = 'middle') {
  c.font = font(px, serif); c.fillStyle = color; c.textAlign = align; c.textBaseline = base; c.fillText(str, x, y);
}
function makeCanvas(w, h) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; return cv; }
// render-time clock: advances every frame in every state, so pulses and torch flicker never stop
let RT = 0;
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const easeOutBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
const pulse = (t, hz, lo, hi) => lo + (hi - lo) * (0.5 + 0.5 * Math.sin(t * hz * TAU));

// ---- UI primitives (lifted from the Designer's ui-scratch.html: rrect/ell/rgba + letter-spaced text)
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
// rounded-rect path with an arc-based fallback for engines without ctx.roundRect
function rpath(c, x, y, w, h, r) {
  if (c.roundRect) { c.beginPath(); c.roundRect(x, y, w, h, r); return; }
  const k = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  c.beginPath(); c.moveTo(x + k, y);
  c.arcTo(x + w, y, x + w, y + h, k); c.arcTo(x + w, y + h, x, y + h, k);
  c.arcTo(x, y + h, x, y, k); c.arcTo(x, y, x + w, y, k); c.closePath();
}
function rrect(c, x, y, w, h, r, fill, stroke, lw) {
  rpath(c, x, y, w, h, r);
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.lineWidth = lw || 2; c.strokeStyle = stroke; c.stroke(); }
}
function ell(c, x, y, rx, ry, fill, stroke, lw, rot) {
  c.beginPath(); c.ellipse(x, y, rx, ry, rot || 0, 0, TAU);

// ---------------------------------------------------------------- MUSIC (spec §12, last row)
// A minor-key organ pedal drone (two detuned saws -> lowpass) under TITLE and the card screen; a
// scheduled 16th-note triangle arpeggio over i-VI-III-VII joins in PLAYING, its lowpass cutoff and
// note density climbing with the wave. Own gain into the same compressor, ~12 dB under the sfx bus,
// ducked on every shot. It schedules nothing while paused, muted, or with the context suspended,
// and it owns exactly two long-lived oscillators, torn down after MUSIC_IDLE seconds of silence.
const Music = (() => {
  // i · VI · III · VII in A minor, voiced close together so the figure walks instead of leaping
  const CHORDS = [[0, 3, 7, 12], [-4, 0, 3, 8], [3, 7, 10, 15], [-2, 2, 5, 10]];
  const ARP = [0, 1, 2, 3, 2, 1, 2, 3];  // the figure walked inside each chord

    droneOscA.connect(droneFilter); droneOscB.connect(droneFilter);
    droneOscA.start(); droneOscB.start();
    arpFilter = ac.createBiquadFilter(); arpFilter.type = 'lowpass'; arpFilter.frequency.value = CONFIG.MUSIC_CUT_BASE; arpFilter.Q.value = CONFIG.MUSIC_CUT_Q;

// ===================================================================== SPRITES
// The Designer's procedural recipes (docs/jam/art/sprites-scratch.html), lifted.
// Pivot: (x, y) is the FEET (bottom-centre) unless noted; s = scale, 1 = in-game size.
// All geometry is in local units, so ctx.scale(s) scales the 2 px ink outline too.
// These numbers are ART, not tuning: they live here beside the recipes, never in CONFIG.

// the ground shadow is baked out of the pre-rendered bodies (a white silhouette must not
// include it, and squash/stretch must not scale it), so the world draws it at blit time
let SPR_SHADOWS = true;
function shadow(c, x, y, rx, ry) {
  if (!SPR_SHADOWS) return;
  c.fillStyle = PAL.shadow; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU); c.fill();
}
function drawShadow(c, x, y, rx, ry) { c.fillStyle = PAL.shadow; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU); c.fill(); }
// outlined thick line (limbs): ink underlay then colour
function limb(c, x1, y1, x2, y2, w, colour) {
  c.lineCap = 'round';
  c.lineWidth = w + 3; c.strokeStyle = PAL.ink; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  c.lineWidth = w; c.strokeStyle = colour; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  c.lineCap = 'butt';

// ---------------------------------------------------------------- THE NUN
// o = { facing: 1|-1, lean: radians around the feet, walk: 0|1, shadow: bool }
// Height ~31 px at s=1 (feet to veil top). Hand pivot for the gun: NUN_HAND.
const NUN_HAND = { x: 2.5, y: -14.5 };
function drawNun(c, x, y, s, o) {
  o = o || {};
  const facing = o.facing || 1, walk = o.walk || 0;

  c.translate(x, y);
  c.scale(s * facing, s);
  if (o.shadow !== false) shadow(c, 0, 0, 9, 3);
  c.rotate(o.lean || 0);
  c.lineJoin = 'round';
  // shoes
  const step = walk ? 1.5 : 0;
  rrect(c, -7 + step, -3.2, 5.5, 3.2, 1.2, PAL.shoe, PAL.ink, 1);
  rrect(c, 1.5 - step, -3.2, 5.5, 3.2, 1.2, PAL.shoe, PAL.ink, 1);
  // veil (behind everything): cap over the head, trailing to the shoulders
  c.beginPath();
  c.moveTo(-9, -12);
  c.quadraticCurveTo(-10.2, -22, -7.6, -26.8);
  c.quadraticCurveTo(-3.6, -31.4, 0, -31.4);
  c.quadraticCurveTo(3.6, -31.4, 7.6, -26.8);
  c.quadraticCurveTo(10.2, -22, 9, -12);
  c.quadraticCurveTo(0, -10, -9, -12);
  c.closePath();
  c.fillStyle = PAL.habit; c.fill(); c.lineWidth = 2; c.strokeStyle = PAL.ink; c.stroke();
  // habit: bell
  c.beginPath();
  c.moveTo(-5.2, -18.5); c.lineTo(5.2, -18.5);
  c.quadraticCurveTo(9, -11, 9.8, -1.5);
  c.quadraticCurveTo(0, 0.6, -9.8, -1.5);
  c.quadraticCurveTo(-9, -11, -5.2, -18.5);
  c.closePath();
  c.fillStyle = PAL.habit; c.fill(); c.lineWidth = 2; c.strokeStyle = PAL.ink; c.stroke();
  // habit highlight (light from upper-left)
  c.beginPath();
  c.moveTo(-4.4, -17.5);
  c.quadraticCurveTo(-7.6, -11, -8.2, -2.8);
  c.lineTo(-5.6, -2.6);
  c.quadraticCurveTo(-5.6, -11, -2.4, -17.5);
  c.closePath();
  c.fillStyle = PAL.habitHi; c.fill();
  // scapular strip
  rrect(c, -2.1, -17.8, 4.2, 15.3, 0.6, PAL.bone, PAL.ink, 1);
  // gold cross
  c.fillStyle = PAL.gold;
  c.fillRect(-0.75, -15.6, 1.5, 5.2);
  c.fillRect(-2.4, -14.2, 4.8, 1.5);
  // coif ring (white, wider than the head) — THE nun silhouette
  ell(c, 0, -22, 6.7, 7, PAL.bone, PAL.ink, 2);
  // face
  ell(c, 0, -21.6, 3.9, 4.7, PAL.skin);
  // eyes + deadpan mouth
  c.fillStyle = PAL.eye;
  c.fillRect(-2.4, -22.9, 1.5, 1.7);
  c.fillRect(0.9, -22.9, 1.5, 1.7);
  c.fillRect(-0.8, -19.4, 1.6, 0.8);
  c.restore();
}

// ---------------------------------------------------------------- THE PRIEST
// Father Horatio. The nun's recipe, her pivot, her tones: same feet, same bell, same 2 px ink, and
// the gun hangs off the same hand. Everything that tells them apart is above the shoulders —
// where she has a white coif RING around her head, he has a dark head over a white COLLAR BAND at
// the neck, and his chest is bare cassock with the gold cross on it instead of her bone scapular.
// Height ~30 px at s=1 (feet to crown).
function drawPriest(c, x, y, s, o) {
  o = o || {};
  const facing = o.facing || 1, walk = o.walk || 0;
  c.save();
  c.translate(x, y);
  c.scale(s * facing, s);
  if (o.shadow !== false) shadow(c, 0, 0, 9, 3);
  c.rotate(o.lean || 0);
  c.lineJoin = 'round';
  // shoes
  const step = walk ? 1.5 : 0;
  rrect(c, -7 + step, -3.2, 5.5, 3.2, 1.2, PAL.shoe, PAL.ink, 1);
  rrect(c, 1.5 - step, -3.2, 5.5, 3.2, 1.2, PAL.shoe, PAL.ink, 1);
  // cassock: the habit's bell, verbatim
  c.beginPath();
  c.moveTo(-5.2, -18.5); c.lineTo(5.2, -18.5);
  c.quadraticCurveTo(9, -11, 9.8, -1.5);
  c.quadraticCurveTo(0, 0.6, -9.8, -1.5);
  c.quadraticCurveTo(-9, -11, -5.2, -18.5);
  c.closePath();
  c.fillStyle = PAL.habit; c.fill(); c.lineWidth = 2; c.strokeStyle = PAL.ink; c.stroke();
  // cassock highlight (light from upper-left), same as hers
  c.beginPath();
  c.moveTo(-4.4, -17.5);
  c.quadraticCurveTo(-7.6, -11, -8.2, -2.8);
  c.lineTo(-5.6, -2.6);
  c.quadraticCurveTo(-5.6, -11, -2.4, -17.5);
  c.closePath();
  c.fillStyle = PAL.habitHi; c.fill();
  // the button placket, then the gold cross straight on the cloth
  c.fillStyle = PAL.habitHi;
  for (let i = 0; i < 4; i++) c.fillRect(-0.45, -16.2 + i * 3.2, 0.9, 0.9);
  c.fillStyle = PAL.gold;   // a pectoral cross, hung low enough to clear the gun across his chest
  c.fillRect(-0.9, -13.4, 1.8, 6.2);
  c.fillRect(-2.9, -11.6, 5.8, 1.8);
  // head: a dark brown crop where she has a ring of bone. The hair is drawn as a whole head and the
  // face sits inside it, so what is left is a rim - thick over the crown, hairline thin at the jaw.
  ell(c, 0, -25.2, 4.35, 4.9, PAL.hair, PAL.ink, 2);
  ell(c, 0, -24.2, 3.7, 4.1, PAL.skin);
  // the fringe, swept to his right, and the light from the upper-left on the crown
  c.beginPath();
  c.moveTo(-3.9, -26.7);
  c.quadraticCurveTo(-1.0, -29.0, 3.4, -27.4);
  c.quadraticCurveTo(0.0, -26.5, -3.7, -25.8);
  c.closePath();
  c.fillStyle = PAL.hair; c.fill();
  c.beginPath();
  c.moveTo(-3.8, -26.3);
  c.quadraticCurveTo(-3.4, -28.8, -0.4, -29.6);
  c.quadraticCurveTo(-1.9, -28.2, -2.4, -26.0);
  c.closePath();
  c.fillStyle = PAL.hairHi; c.fill();
  // eyes, deadpan, at her spacing
  c.fillStyle = PAL.eye;
  c.fillRect(-2.4, -25.4, 1.5, 1.7);
  c.fillRect(0.9, -25.4, 1.5, 1.7);
  // THE COLLAR: a white band across the neck, over the chin, with the dark notch at the centre.
  // This is the read at 1x - a bright bar at the neck instead of a bright ring at the head.
  rrect(c, -4.9, -21.7, 9.8, 3.1, 0.9, PAL.bone, PAL.ink, 1.5);
  c.fillStyle = PAL.habit; c.fillRect(-0.8, -21.1, 1.6, 2.5);
  c.restore();
}

// ---------------------------------------------------------------- THE SHOTGUN
// (x, y) = pivot at the nun's hand. angle in radians. pumpOffset 0..1 racks the block 5 px back.
// Muzzle at local (GUN_MUZZLE, 0). Too long on purpose: 38.5 px at s=1 (~1.25x the nun).
const GUN_MUZZLE = 28;
function drawGun(c, x, y, s, angle, pumpOffset) {
  c.save();
  c.translate(x, y);
  c.scale(s, s);
  c.rotate(angle);
  if (Math.cos(angle) < 0) c.scale(1, -1);   // keep the stock hanging down when aiming left
  c.lineJoin = 'round';
  // stock
  c.beginPath();
  c.moveTo(-1, -2); c.lineTo(-1, 2.2); c.lineTo(-10, 4.6); c.lineTo(-10.5, 1); c.closePath();
  c.fillStyle = PAL.stock; c.fill(); c.lineWidth = 2; c.strokeStyle = PAL.ink; c.stroke();
  c.strokeStyle = PAL.stockHi; c.lineWidth = 1; c.beginPath(); c.moveTo(-2, -0.6); c.lineTo(-9, 1.6); c.stroke();
  // rear hand at the grip
  ell(c, 0.5, 2, 2, 1.7, PAL.skin, PAL.ink, 1);
  // receiver
  rrect(c, -2, -2.4, 10, 4.8, 1, PAL.gunDark, PAL.ink, 2);
  // barrel
  rrect(c, 7, -1.6, GUN_MUZZLE - 7, 3.2, 0.6, PAL.gunDark, PAL.ink, 2);
  c.fillStyle = PAL.gunHi; c.fillRect(8, -1.4, GUN_MUZZLE - 9, 1);
  // muzzle cap
  rrect(c, GUN_MUZZLE - 2, -2.1, 2.4, 4.2, 0.6, PAL.pump, PAL.ink, 1.5);
  // pump block + front hand
  const px = 13 - 5 * (pumpOffset || 0);
  rrect(c, px, -2.6, 7, 5.2, 1, PAL.pump, PAL.ink, 2);
  ell(c, px + 3.5, 1.6, 2.1, 1.7, PAL.skin, PAL.ink, 1);
  c.restore();
}

// ---------------------------------------------------------------- THE RESTLESS (and the Ghost body)
// frame 0|1 = 2-frame walk. ~26 px tall. Faces +x; flip with scale(-1, 1) around the feet.
function drawRestlessBody(c, frame, pal, ghost) {
  c.lineJoin = 'round';
  if (!ghost) {
    shadow(c, 0, 0, 8, 2.6);
    // legs: apart / together
    const xs = frame ? [-3.2, -0.2] : [-5.5, 1.5];
    for (const lx of xs) {
      rrect(c, lx, -7.5, 3, 7.5, 1, pal.shade, PAL.ink, 1.5);
      rrect(c, lx - 0.5, -1.8, 4.2, 1.8, 0.6, PAL.shoe, PAL.ink, 1);
    }
  } else {
    // wavy floating hem instead of legs
    const w = frame ? 1.5 : -1.5;
    c.beginPath();
    c.moveTo(-6.2, -6);
    c.quadraticCurveTo(-8, -1 + w, -5.5, 1.5);
    c.quadraticCurveTo(-2.5, -1 - w, 0, 1.5);
    c.quadraticCurveTo(2.5, -1 + w, 5.5, 1.5);
    c.quadraticCurveTo(8, -1 - w, 6.2, -6);
    c.closePath();
    c.fillStyle = pal.shade; c.fill(); c.lineWidth = 2; c.strokeStyle = PAL.ink; c.stroke();
  }
  // back arm (hanging forward, zombie style)
  limb(c, -1, -13.5, 4.5, -3.5, 3, pal.shade);
  ell(c, 4.8, -3, 1.9, 1.7, pal.base, PAL.ink, 1);
  // hunched torso
  c.beginPath();
  c.moveTo(-6, -6);
  c.quadraticCurveTo(-8.5, -13, -3, -16.5);
  c.lineTo(5.5, -16.5);
  c.quadraticCurveTo(8, -11, 6, -6);
  c.quadraticCurveTo(0, -4.5, -6, -6);
  c.closePath();
  c.fillStyle = pal.base; c.fill(); c.lineWidth = 2; c.strokeStyle = PAL.ink; c.stroke();
  // shade tone on the right
  c.beginPath();
  c.moveTo(3, -16.2);
  c.quadraticCurveTo(7.6, -11, 5.8, -6.3);
  c.lineTo(2.4, -5.7);
  c.quadraticCurveTo(4.8, -11, 3, -16.2);
  c.closePath();
  c.fillStyle = pal.shade; c.fill();
  // front arm
  limb(c, 4, -13.5, 9, -4, 3, pal.shade);
  ell(c, 9.3, -3.5, 1.9, 1.7, pal.base, PAL.ink, 1);
  // Elizabethan ruff: scallops then disc
  const rx0 = 2.5, ry0 = -16.6;
  c.fillStyle = pal.ruff; c.strokeStyle = PAL.ink; c.lineWidth = 1;
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * TAU;
    c.beginPath(); c.ellipse(rx0 + Math.cos(a) * 6, ry0 + Math.sin(a) * 2.4, 1.7, 1.5, 0, 0, TAU); c.fill(); c.stroke();
  }
  ell(c, rx0, ry0, 6, 2.3, pal.ruff, PAL.ink, 1);
  // head, tilted forward
  ell(c, 4.5, -21, 4.7, 4.2, pal.base, PAL.ink, 2, 0.35);
  // hair tufts
  c.fillStyle = PAL.ink;
  c.fillRect(1.6, -25.4, 1, 2.2); c.fillRect(3.6, -26, 1, 2.6); c.fillRect(5.8, -25.6, 1, 2);
  // sunken sockets + mouth
  ell(c, 3.1, -21.6, 1.4, 1.5, PAL.ink);
  ell(c, 6.4, -21, 1.4, 1.5, PAL.ink);
  c.fillRect(5, -18.9, 2.4, 1);
}
const PAL_RESTLESS = { base: PAL.green, shade: PAL.greenShade, ruff: PAL.bone };
function drawRestless(c, x, y, s, frame) {
  c.save(); c.translate(x, y); c.scale(s, s);
  drawRestlessBody(c, frame, PAL_RESTLESS, false);
  c.restore();
}

// ---------------------------------------------------------------- THE GHOST
// 50%-alpha cyan Restless silhouette, no shadow, no legs, crown outline, wavers by frame.
// Pre-rendered at alpha 1 and blitted at 0.5 so overlapping shapes do not double up.
const PAL_GHOST = { base: PAL.ghost, shade: PAL.ghostShade, ruff: '#dff7ff' };
function drawGhost(c, x, y, s, frame) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.transform(1, 0, frame ? 0.08 : -0.08, 1, 0, 0);   // waver: tiny shear
  drawRestlessBody(c, frame, PAL_GHOST, true);
  // crown outline on the head
  c.lineWidth = 1.4; c.strokeStyle = PAL.gold; c.lineJoin = 'miter';
  c.beginPath();
  c.moveTo(1.2, -24.2); c.lineTo(1.2, -28); c.lineTo(3.2, -26); c.lineTo(4.8, -29); c.lineTo(6.4, -26); c.lineTo(8.4, -28); c.lineTo(8.4, -24.2);
  c.stroke();
  c.restore();
}

// ---------------------------------------------------------------- YORICK (skull)
// frame 0|1 = jaw shut / jaw chattering open. ~15 px tall.
function drawYorick(c, x, y, s, frame) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.lineJoin = 'round';
  shadow(c, 0, 0, 5, 1.7);
  const jaw = frame ? 1.6 : 0;
  // jaw
  rrect(c, -4.2, -6 + jaw, 8.4, 4, 1.2, PAL.bone, PAL.ink, 1.5);
  c.fillStyle = PAL.ink;
  for (const tx of [-2.6, -0.6, 1.4]) c.fillRect(tx, -6 + jaw, 1.1, 1.6);
  // cranium
  ell(c, 0, -9.8, 6.2, 5.6, PAL.bone, PAL.ink, 2);
  // shade tone on the right
  c.beginPath();
  c.moveTo(2.2, -14.8);
  c.quadraticCurveTo(7.4, -11.5, 4.6, -5.2);
  c.quadraticCurveTo(4.4, -9.5, 2.2, -14.8);
  c.closePath();
  c.fillStyle = PAL.boneShade; c.fill();
  // sockets + nose
  ell(c, -2.5, -10.2, 1.8, 2, PAL.ink);
  ell(c, 2.5, -10.2, 1.8, 2, PAL.ink);
  c.fillStyle = PAL.ink; c.beginPath(); c.moveTo(0, -8.4); c.lineTo(-0.9, -6.6); c.lineTo(0.9, -6.6); c.closePath(); c.fill();
  c.restore();
}

// ---------------------------------------------------------------- BRUTE (Gravedigger / Claudius)
// ~50 px tall at k=1 (plus the shovel over the shoulder). frame 0|1 = lumbering step.
function drawBrute(c, frame, pal, accessory, crown) {
  c.lineJoin = 'round';
  const bob = frame ? 1.2 : 0;
  shadow(c, 0, 0, 17, 5);
  // legs
  const xs = frame ? [-9.5, 1] : [-12, 3.5];
  for (const lx of xs) {
    rrect(c, lx, -11, 8.5, 11, 2, pal.shade, PAL.ink, 2);
    rrect(c, lx - 0.8, -3, 10, 3, 1, PAL.shoe, PAL.ink, 1.2);
  }
  c.translate(0, -bob);
  // shovel handle behind (over the shoulder)
  if (accessory === 'shovel') {
    limb(c, 19, -14, -3, -52, 3, PAL.stock);
    c.beginPath(); c.moveTo(-9, -60); c.lineTo(0, -58); c.lineTo(0.5, -47); c.lineTo(-7.5, -49); c.closePath();
    c.fillStyle = PAL.pump; c.fill(); c.lineWidth = 2; c.strokeStyle = PAL.ink; c.stroke();
    c.fillStyle = PAL.gunHi; c.fillRect(-7.5, -57.5, 1.4, 8);
  }
  // back arm
  limb(c, -14, -32, -18, -12, 7, pal.base);
  ell(c, -18.5, -9.5, 4.2, 3.6, pal.base, PAL.ink, 2);
  // torso
  c.beginPath();
  c.moveTo(-17, -9);
  c.quadraticCurveTo(-21, -30, -9, -39);
  c.quadraticCurveTo(0, -42, 9, -39);
  c.quadraticCurveTo(21, -30, 17, -9);
  c.quadraticCurveTo(0, -5, -17, -9);
  c.closePath();
  c.fillStyle = pal.base; c.fill(); c.lineWidth = 2; c.strokeStyle = PAL.ink; c.stroke();
  // shade tone right
  c.beginPath();
  c.moveTo(6, -39.6);
  c.quadraticCurveTo(20.2, -30, 16.6, -9.4);
  c.lineTo(9, -7.6);
  c.quadraticCurveTo(12.5, -25, 6, -39.6);
  c.closePath();
  c.fillStyle = pal.shade; c.fill();
  // strap
  c.beginPath(); c.moveTo(-15, -22); c.lineTo(15, -19); c.lineTo(15, -15); c.lineTo(-15, -18); c.closePath();
  c.fillStyle = pal.shade; c.fill(); c.lineWidth = 1.2; c.strokeStyle = PAL.ink; c.stroke();
  // head, sunk into the shoulders
  ell(c, 2, -43, 6.6, 6.2, pal.head, PAL.ink, 2);
  c.fillStyle = PAL.ink;
  c.fillRect(-2.6, -46.2, 9.6, 1.7);           // brow
  ell(c, 0.2, -43.6, 1.15, 1.2, PAL.ink);      // eyes, close together
  ell(c, 4.6, -43.6, 1.15, 1.2, PAL.ink);
  c.fillRect(1, -40.2, 3.4, 1);                // mouth
  if (crown) {
    c.beginPath();
    c.moveTo(-3.5, -47.5); c.lineTo(-3.5, -54); c.lineTo(-0.8, -50.5); c.lineTo(2, -55.5); c.lineTo(4.8, -50.5); c.lineTo(7.5, -54); c.lineTo(7.5, -47.5);
    c.closePath();
    c.fillStyle = PAL.gold; c.fill(); c.lineWidth = 1.6; c.strokeStyle = PAL.ink; c.lineJoin = 'miter'; c.stroke(); c.lineJoin = 'round';
  }
  // front arm + fist
  limb(c, 14, -32, 20, -15, 7, pal.base);
  ell(c, 20.5, -13, 4.2, 3.6, pal.base, PAL.ink, 2);
  if (accessory === 'goblet') {
    rrect(c, 17, -25, 7.5, 8, 1.5, PAL.gold, PAL.ink, 1.6);     // cup
    c.fillStyle = PAL.ink; c.fillRect(20, -17, 1.6, 4);         // stem
    ell(c, 20.8, -12.4, 3.4, 1.3, PAL.gold, PAL.ink, 1.2);      // foot
    c.fillStyle = PAL.muzzle; c.fillRect(18.2, -24, 1.2, 5);    // highlight
  }
}
const PAL_GRAVEDIGGER = { base: PAL.greyGreen, shade: PAL.greyGreenShade, head: PAL.greyGreen };
const PAL_CLAUDIUS = { base: PAL.purple, shade: PAL.purpleShade, head: PAL.paleFace };
function drawGravedigger(c, x, y, s, frame) {
  c.save(); c.translate(x, y); c.scale(s, s);
  drawBrute(c, frame, PAL_GRAVEDIGGER, 'shovel', false);
  c.restore();
}
// Claudius: the Gravedigger at 3x, purple robe, gold crown, goblet, pale lavender face.
function drawClaudius(c, x, y, s, frame) {
  c.save(); c.translate(x, y); c.scale(s * 3, s * 3);
  drawBrute(c, frame, PAL_CLAUDIUS, 'goblet', true);
  c.restore();
}

// ---------------------------------------------------------------- HUD + small things
// Heart: pivot bottom-centre (the point). ~11 x 10 px.
function drawHeart(c, x, y, s) {
  c.save(); c.translate(x, y); c.scale(s, s); c.lineJoin = 'round';
  c.beginPath();
  c.moveTo(0, 0);
  c.bezierCurveTo(-6.2, -4.2, -6.4, -10.4, -2.8, -10.4);
  c.quadraticCurveTo(-0.9, -10.4, 0, -8.2);
  c.quadraticCurveTo(0.9, -10.4, 2.8, -10.4);
  c.bezierCurveTo(6.4, -10.4, 6.2, -4.2, 0, 0);
  c.closePath();
  c.fillStyle = PAL.heart; c.fill(); c.lineWidth = 2; c.strokeStyle = PAL.ink; c.stroke();
  ell(c, -2.7, -7.6, 1.3, 0.9, PAL.heartHi, null, 0, -0.5);
  c.restore();
}
function drawHeartEmpty(c, x, y, s) {
  c.save(); c.translate(x, y); c.scale(s, s); c.lineJoin = 'round';
  c.beginPath(); c.moveTo(0, 0);
  c.bezierCurveTo(-6.2, -4.2, -6.4, -10.4, -2.8, -10.4); c.quadraticCurveTo(-0.9, -10.4, 0, -8.2);
  c.quadraticCurveTo(0.9, -10.4, 2.8, -10.4); c.bezierCurveTo(6.4, -10.4, 6.2, -4.2, 0, 0); c.closePath();
  c.fillStyle = 'rgba(7,7,13,0.55)'; c.fill(); c.lineWidth = 2; c.strokeStyle = rgba(PAL.cream, 0.35); c.stroke();
  c.restore();
}
// Shell pip for the HUD tube: pivot bottom-centre, 5 x 10 px. empty = hollow spent pip.
function drawShellPip(c, x, y, s, empty) {
  c.save(); c.translate(x, y); c.scale(s, s);
  if (empty) {
    c.globalAlpha *= 0.35;
    rrect(c, -2.5, -10, 5, 10, 1.2, null, PAL.cream, 1.2);
  } else {
    rrect(c, -2.5, -10, 5, 7.6, 1.2, PAL.amber, PAL.ink, 1.2);
    rrect(c, -2.5, -3, 5, 3, 0.6, PAL.brass, PAL.ink, 1.2);
    c.fillStyle = PAL.muzzle; c.fillRect(-1.6, -9, 1, 5.6);
  }
  c.restore();
}
// Ejected casing: pivot CENTRE (it tumbles), 5.2 x 2.6 px, rot in radians.
function drawCasing(c, x, y, s, rot) {
  c.save(); c.translate(x, y); c.scale(s, s); c.rotate(rot || 0);
  rrect(c, -2.6, -1.3, 5.2, 2.6, 0.8, PAL.brass, PAL.ink, 1);
  c.fillStyle = PAL.brassDark; c.fillRect(-2.6, -1.3, 1.5, 2.6);
  c.fillStyle = PAL.muzzle; c.fillRect(-0.8, -1, 2.6, 0.7);
  c.restore();
}
// Gate in the border wall. (x, y) = centre of the opening on the wall's centre-line.
// side: 'N'|'E'|'S'|'W'. glow 0..1 tints the tunnel; the amber blob itself is FX.glow (cached).
// 48 wide x 16 deep at s=1 (the border is 16 px).
const GATE_ROT = { N: 0, E: Math.PI / 2, S: Math.PI, W: -Math.PI / 2 };
function drawGate(c, x, y, s, side, glow) {
  c.save(); c.translate(x, y); c.scale(s, s); c.rotate(GATE_ROT[side] || 0);   // local: wall along x, arena is +y
  // wall slab around the opening
  c.fillStyle = PAL.border; c.fillRect(-30, -8, 60, 16);
  // the opening: a dark tunnel
  rrect(c, -14, -8.5, 28, 17, 0.8, PAL.gateDark, PAL.ink, 2);
  // tunnel floor tint when telegraphing
  if (glow > 0) { c.fillStyle = 'rgba(255,179,71,' + (0.45 * glow).toFixed(3) + ')'; c.fillRect(-12, 1, 24, 6); }
  // steps
  c.fillStyle = PAL.borderHi; c.fillRect(-12, -3, 24, 1.2); c.fillRect(-12, 2, 24, 1.2);
  // posts
  rrect(c, -19, -9.5, 5, 19, 1, PAL.borderHi, PAL.ink, 2);
  rrect(c, 14, -9.5, 5, 19, 1, PAL.borderHi, PAL.ink, 2);
  // torches on the arena side of the posts
  const t = 0.6 + 0.4 * (glow || 0);
  ell(c, -16.5, 8.5, 2.2, 2.2, PAL.amber, PAL.ink, 1);
  ell(c, 16.5, 8.5, 2.2, 2.2, PAL.amber, PAL.ink, 1);
  c.globalAlpha = t; ell(c, -16.5, 8.5, 1, 1, PAL.muzzle); ell(c, 16.5, 8.5, 1, 1, PAL.muzzle); c.globalAlpha = 1;
  c.restore();
}

// ---------------------------------------------------------------- composition
// Both characters are drawn by the same recipe from here on: one body function, one gun, one set of
// over/under and flip rules. Nothing downstream needs to know which of them it is holding.
const CHAR_BODY = { nun: drawNun, priest: drawPriest };
function drawCharBody(c, id, x, y, s, o) { (CHAR_BODY[id] || drawNun)(c, x, y, s, o); }
// Gun OVER the body when aiming down (sin >= 0), UNDER when aiming up. Body flips when cos < 0.
function drawCharacterWithGun(id, c, x, y, s, angle, pumpOffset, o) {
  o = Object.assign({}, o || {});
  const facing = Math.cos(angle) < 0 ? -1 : 1;
  o.facing = facing;
  const hx = x + NUN_HAND.x * s * facing, hy = y + NUN_HAND.y * s;
  if (Math.sin(angle) >= 0) { drawCharBody(c, id, x, y, s, o); drawGun(c, hx, hy, s, angle, pumpOffset); }
  else { drawGun(c, hx, hy, s, angle, pumpOffset); drawCharBody(c, id, x, y, s, o); }
}

// ---------------------------------------------------------------- pre-render
// Every body is drawn ONCE at boot into an offscreen canvas at 2x (both frames), plus a white
// `source-in` silhouette for hit flashes. The world blits them with drawImage; nothing here runs per frame.
const SPR_K = 2;
// w/h = the local-space box, ax/ay = the FEET pivot inside it, sx/sy = the ground shadow radii,
// foot = how far the feet sit below the entity's collision centre.
const SPRITE_BOX = {
  nun: { w: 26, h: 38, ax: 13, ay: 35, sx: 9, sy: 3, foot: 14, draw: (c, x, y, f) => drawNun(c, x, y, 1, { facing: 1, walk: f }) },
  priest: { w: 26, h: 38, ax: 13, ay: 35, sx: 9, sy: 3, foot: 14, draw: (c, x, y, f) => drawPriest(c, x, y, 1, { facing: 1, walk: f }) },
  restless: { w: 34, h: 34, ax: 14, ay: 31, sx: 8, sy: 2.6, foot: 12, draw: (c, x, y, f) => drawRestless(c, x, y, 1, f) },
  ghost: { w: 38, h: 36, ax: 17, ay: 32, sx: 0, sy: 0, foot: 12, alpha: 0.5, draw: (c, x, y, f) => drawGhost(c, x, y, 1, f) },
  yorick: { w: 20, h: 20, ax: 10, ay: 18, sx: 5, sy: 1.7, foot: 7, draw: (c, x, y, f) => drawYorick(c, x, y, 1, f) },
  gravedigger: { w: 56, h: 68, ax: 26, ay: 64, sx: 17, sy: 5, foot: 22, draw: (c, x, y, f) => drawGravedigger(c, x, y, 1, f) },
  claudius: { w: 152, h: 180, ax: 74, ay: 176, sx: 51, sy: 15, foot: 52, draw: (c, x, y, f) => drawClaudius(c, x, y, 1, f) },
};
const SPR = {};
function buildSprites() {
  SPR_SHADOWS = false;
  for (const key in SPRITE_BOX) {
    const b = SPRITE_BOX[key], img = [], white = [];
    for (let f = 0; f < 2; f++) {
      const cv = makeCanvas(Math.ceil(b.w * SPR_K), Math.ceil(b.h * SPR_K));
      const c = cv.getContext('2d');
      c.setTransform(SPR_K, 0, 0, SPR_K, 0, 0);
      b.draw(c, b.ax, b.ay, f);
      img.push(cv);
      const wv = makeCanvas(cv.width, cv.height), wc = wv.getContext('2d');
      wc.drawImage(cv, 0, 0);
      wc.globalCompositeOperation = 'source-in';
      wc.fillStyle = '#ffffff'; wc.fillRect(0, 0, wv.width, wv.height);
      white.push(wv);
    }
    SPR[key] = { img, white, box: b };
  }
  SPR_SHADOWS = true;
}
// blit a pre-rendered body: o = { face, sx, sy, rot, white }
function blitBody(c, key, frame, x, feetY, o) {
  const s = SPR[key]; if (!s) return;
  const b = s.box, img = (o && o.white) ? s.white[frame & 1] : s.img[frame & 1];
  c.save();
  c.translate(x, feetY);
  if (o && o.rot) c.rotate(o.rot);
  c.scale(((o && o.sx) || 1) * ((o && o.face) || 1), (o && o.sy) || 1);
  c.drawImage(img, -b.ax, -b.ay, b.w, b.h);
  c.restore();
}

// ---------------------------------------------------------------- the nun in the world
const NUN_FOOT = SPRITE_BOX.nun.foot;   // feet below her collision centre
const VEIL_ANCHOR = 24, VEIL_LAG = 0.4, VEIL_W = 6.5;   // the trail hangs off the back of the coif
const NUN_LEAN = 900, NUN_STRETCH = 0.18, NUN_SQUASH = 0.14, NUN_WALK_HZ = 8;
const PICKUP_HEART_S = 1.7, HUD_HEART_S = 1.7, HUD_PIP_S = 1.6;
function drawVeilTrail(c, p) {
  const ax = p.x, ay = p.y + NUN_FOOT - VEIL_ANCHOR, v = p.veil;
  if (Math.abs(v[2].x - ax) + Math.abs(v[2].y - ay) < 1.5) return;   // standing still: nothing to trail
  const pts = [{ x: ax, y: ay }, v[0], v[1], v[2]];
  const left = [], right = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    const [nx, ny] = norm(-(b.y - a.y), b.x - a.x);
    const w = VEIL_W * (1 - i / (pts.length - 1)) + 0.6;
    left.push([pts[i].x + nx * w, pts[i].y + ny * w]);
    right.push([pts[i].x - nx * w, pts[i].y - ny * w]);
  }
  c.beginPath();
  c.moveTo(left[0][0], left[0][1]);
  for (let i = 1; i < left.length; i++) c.lineTo(left[i][0], left[i][1]);
  for (let i = right.length - 1; i >= 0; i--) c.lineTo(right[i][0], right[i][1]);
  c.closePath();
  c.fillStyle = PAL.habit; c.fill();
  c.lineWidth = 1.5; c.strokeStyle = PAL.ink; c.lineJoin = 'round'; c.stroke();
}
// pre-rendered body, procedural gun: the gun rotates to aim, over the body when aiming down and
// under when aiming up; the body flips when the aim crosses vertical (the drawCharacterWithGun rule).
// The body blitted is whichever character this RUN was started as.
function drawPlayerSprite(c, p) {
  const id = runCharId();
  const feetY = p.y + NUN_FOOT;
  const facing = Math.cos(p.aim) < 0 ? -1 : 1;
  const frame = p.moving ? Math.floor(p.walkT * NUN_WALK_HZ) & 1 : 0;
  if (id === 'nun') drawVeilTrail(c, p);   // a cassock has no veil to stream behind it
  // a cream ring on the flagstones: her footprint stays readable with a body standing on it
  c.strokeStyle = rgba(PAL.cream, CONFIG.NUN_RING_A); c.lineWidth = CONFIG.NUN_RING_LW;
  c.beginPath(); c.ellipse(p.x, feetY, CONFIG.NUN_RING_RX, CONFIG.NUN_RING_RY, 0, 0, TAU); c.stroke();
  drawShadow(c, p.x, feetY, SPRITE_BOX.nun.sx, SPRITE_BOX.nun.sy);
  const st = p.stretch || 0;
  c.save();
  c.translate(p.x, feetY);
  c.rotate(clamp(p.kvx / NUN_LEAN, -0.35, 0.35));                                   // lean into the recoil
  if (st > 0.01) { c.rotate(p.aim); c.scale(1 + st * NUN_STRETCH, 1 - st * NUN_SQUASH); c.rotate(-p.aim); }
  const pump = clamp((p.gunSlide || 0) / CONFIG.GUN_SLIDE_PX, 0, 1);
  const body = () => blitBody(c, id, frame, 0, 0, { face: facing });
  const gun = () => drawGun(c, NUN_HAND.x * facing, NUN_HAND.y, 1, p.aim, pump);
  if (Math.sin(p.aim) >= 0) { body(); gun(); } else { gun(); body(); }
  c.restore();
}

// ===================================================================== FX
// Particles ring buffer (fillRect only), camera shake/kick, muzzle flashes, pops, screen flashes.
const FX = (() => {
  const N = CONFIG.PARTICLES;
  const px = new Float32Array(N), py = new Float32Array(N), vx = new Float32Array(N), vy = new Float32Array(N);
  const life = new Float32Array(N), maxLife = new Float32Array(N), size = new Float32Array(N), grav = new Float32Array(N), drag = new Float32Array(N);
  const color = new Array(N).fill(PAL.bone);
  let cursor = 0, aliveCount = 0;
  function spawn(x, y, vx_, vy_, life_, col, sz, g = 0, dr = 0.92) {
    const i = cursor; cursor = (cursor + 1) % N;
    px[i] = x; py[i] = y; vx[i] = vx_; vy[i] = vy_; life[i] = maxLife[i] = life_; color[i] = col; size[i] = sz; grav[i] = g; drag[i] = dr;
  }
  function burst(x, y, n, opts) {
    for (let k = 0; k < n; k++) {
      const a = opts.angle !== undefined ? opts.angle + (Math.random() - 0.5) * (opts.arc || TAU) : Math.random() * TAU;
      const sp = rand(opts.minSpeed || 40, opts.maxSpeed || 200);
      spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp, rand(opts.minLife || 0.3, opts.maxLife || 0.7), Array.isArray(opts.color) ? pick(opts.color) : opts.color, rand(opts.minSize || 2, opts.maxSize || 4), opts.grav || 0, opts.drag || 0.92);
    }
  }
  function update(dt) {
    let n = 0;
    for (let i = 0; i < N; i++) {
      if (life[i] <= 0) continue;
      life[i] -= dt; if (life[i] <= 0) continue;
      vx[i] *= drag[i]; vy[i] *= drag[i]; vy[i] += grav[i] * dt;
      px[i] += vx[i] * dt; py[i] += vy[i] * dt; n++;
    }
    aliveCount = n;
  }
  function draw(c) {
    for (let i = 0; i < N; i++) {
      if (life[i] <= 0) continue;
      const t = life[i] / maxLife[i], s = size[i] * (0.35 + 0.65 * t);
      c.fillStyle = color[i]; c.fillRect(px[i] - s / 2, py[i] - s / 2, s, s);
    }
  }
  function clearAll() { life.fill(0); aliveCount = 0; }
  // camera
  const cam = { shakeT: 0, shakeDur: 0.12, shakeAmp: 0, kickX: 0, kickY: 0, x: 0, y: 0, rot: 0 };
  function shake(pxAmp, dur = CONFIG.SHAKE_FIRE_T) { cam.shakeAmp = Math.max(cam.shakeAmp * (cam.shakeT / cam.shakeDur), pxAmp); cam.shakeT = cam.shakeDur = dur; }
  function kick(dx, dy) { cam.kickX += dx; cam.kickY += dy; }
  const flashes = [], pops = [];
  let hurtFlash = 0, whiteFlash = 0, beatFlash = 0;
  function flash(x, y, angle) { flashes.push({ x, y, angle, t: 0 }); }
  function pop(x, y, r) { pops.push({ x, y, r, t: 0 }); }
  // advances on render time so shake still moves during hitstop
  function tickRender(dt) {
    if (cam.shakeT > 0) {
      cam.shakeT -= dt; const k = Math.max(0, cam.shakeT / cam.shakeDur); const a = cam.shakeAmp * k * k;
      cam.x = (Math.random() * 2 - 1) * a; cam.y = (Math.random() * 2 - 1) * a; cam.rot = (Math.random() * 2 - 1) * a * 0.004;
      if (cam.shakeT <= 0) { cam.shakeAmp = 0; cam.x = cam.y = cam.rot = 0; }
    }
    const kd = Math.exp(-CONFIG.KICK_DECAY * dt); cam.kickX *= kd; cam.kickY *= kd;
    for (let i = flashes.length - 1; i >= 0; i--) { flashes[i].t += dt; if (flashes[i].t > 0.06) flashes.splice(i, 1); }
    for (let i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t > 0.08) pops.splice(i, 1); }
    hurtFlash = Math.max(0, hurtFlash - dt * 2.5);
    whiteFlash = Math.max(0, whiteFlash - dt * 6);
    beatFlash = Math.max(0, beatFlash - dt * 3);
  }
  // pre-rendered radial blobs: built once at boot, blitted forever (no per-frame gradients anywhere)
  let glowBlob, gateGlow, vignetteCv, redVignette;
  function prerender() {
    glowBlob = makeCanvas(128, 128);
    { const g = glowBlob.getContext('2d'); const gr = g.createRadialGradient(64, 64, 4, 64, 64, 64); gr.addColorStop(0, 'rgba(255,243,196,0.9)'); gr.addColorStop(0.35, 'rgba(255,179,71,0.45)'); gr.addColorStop(1, 'rgba(255,179,71,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); }
    // the Designer's amber blob: torches, gate telegraphs, any warm light on the stones
    gateGlow = makeCanvas(128, 128);
    { const g = gateGlow.getContext('2d'); const gr = g.createRadialGradient(64, 64, 2, 64, 64, 64); gr.addColorStop(0, 'rgba(255,179,71,0.9)'); gr.addColorStop(0.5, 'rgba(255,179,71,0.25)'); gr.addColorStop(1, 'rgba(255,179,71,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); }
    vignetteCv = makeCanvas(CONFIG.W, CONFIG.H);
    { const g = vignetteCv.getContext('2d'); const gr = g.createRadialGradient(CONFIG.W / 2, CONFIG.H / 2, CONFIG.H * 0.32, CONFIG.W / 2, CONFIG.H / 2, CONFIG.H * 0.9); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.75)'); g.fillStyle = gr; g.fillRect(0, 0, CONFIG.W, CONFIG.H); }
    redVignette = makeCanvas(CONFIG.W, CONFIG.H);
    { const g = redVignette.getContext('2d'); const gr = g.createRadialGradient(CONFIG.W / 2, CONFIG.H / 2, CONFIG.H * 0.3, CONFIG.W / 2, CONFIG.H / 2, CONFIG.W * 0.65); gr.addColorStop(0, 'rgba(192,57,43,0)'); gr.addColorStop(1, 'rgba(192,57,43,0.9)'); g.fillStyle = gr; g.fillRect(0, 0, CONFIG.W, CONFIG.H); }
  }
  function drawFlashes(c) {
    if (!flashes.length && !pops.length) return;
    c.save(); c.globalCompositeOperation = 'lighter';
    for (const f of flashes) {
      if (f.t < 0.02) {
        c.save(); c.translate(f.x, f.y); c.rotate(f.angle);
        c.fillStyle = 'rgba(255,255,255,0.95)';
        c.beginPath(); c.moveTo(-2, 0); c.lineTo(34, -14); c.lineTo(44, 0); c.lineTo(34, 14); c.closePath(); c.fill();
        c.beginPath(); c.arc(4, 0, 9, 0, TAU); c.fill();
        c.restore();
      }
      const a = f.t < 0.02 ? 1 : 0.6 * (1 - (f.t - 0.02) / 0.04);
      c.globalAlpha = Math.max(0, a); c.drawImage(glowBlob, f.x - 80, f.y - 80, 160, 160);
    }
    c.globalAlpha = 1;
    for (const p of pops) {
      const k = p.t / 0.08; c.globalAlpha = 0.9 * (1 - k);
      c.fillStyle = '#ffffff'; c.beginPath(); c.arc(p.x, p.y, p.r * (1.3 + k * 0.6), 0, TAU); c.fill();
    }
    c.restore();
  }
  function vignette(c, strength) {
    c.save(); c.globalAlpha = strength == null ? 1 : strength; c.drawImage(vignetteCv, 0, 0); c.restore();
  }
  // amber light on the stones: torches, gate telegraphs, muzzle wash
  function glow(c, x, y, r, a) {
    c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = clamp01(a); c.drawImage(gateGlow, x - r, y - r, r * 2, r * 2); c.restore();
  }
  function drawOverlays(c) {
    vignette(c, 1);
    // the hurt flash and the last-heart heartbeat share one pre-rendered red vignette
    const red = Math.max(hurtFlash, beatFlash * CONFIG.LOWHP_VIG);
    if (red > 0) { c.globalAlpha = Math.min(1, red); c.drawImage(redVignette, 0, 0); c.globalAlpha = 1; }
    if (whiteFlash > 0) { c.fillStyle = 'rgba(255,255,255,' + (whiteFlash * 0.5).toFixed(3) + ')'; c.fillRect(0, 0, CONFIG.W, CONFIG.H); }
  }
  function reset() { clearAll(); flashes.length = 0; pops.length = 0; hurtFlash = 0; whiteFlash = 0; beatFlash = 0; cam.shakeT = 0; cam.shakeAmp = 0; cam.kickX = cam.kickY = cam.x = cam.y = cam.rot = 0; }
  return {
    spawn, burst, update, draw, clearAll, reset, cam, shake, kick, flash, pop, tickRender, prerender, drawFlashes, drawOverlays, vignette, glow,
    alive: () => aliveCount, hurt() { hurtFlash = 1; }, white(v = 1) { whiteFlash = Math.max(whiteFlash, v); }, beat() { beatFlash = 1; },
  };
})();

// Floor: persistent offscreen canvas at 2x. Flagstones drawn once; decals and stopped casings stamped onto it.
const Floor = (() => {
  const S = 2; let cv, fc;
  function build() {
    if (!cv) { cv = makeCanvas(CONFIG.W * S, CONFIG.H * S); fc = cv.getContext('2d'); }   // 8 MB backing store: allocate once, repaint on every retry
    fc.setTransform(S, 0, 0, S, 0, 0); fc.globalAlpha = 1;
    fc.fillStyle = PAL.floor; fc.fillRect(0, 0, CONFIG.W, CONFIG.H);
    fc.strokeStyle = PAL.stone; fc.lineWidth = 2;
    const cw = 48, ch = 32;
    for (let y = CONFIG.BORDER; y < CONFIG.H; y += ch) {
      fc.beginPath(); fc.moveTo(0, y); fc.lineTo(CONFIG.W, y); fc.stroke();
      const off = (Math.floor(y / ch) % 2) * (cw / 2);
      for (let x = off; x < CONFIG.W; x += cw) { fc.beginPath(); fc.moveTo(x, y); fc.lineTo(x, y + ch); fc.stroke(); }
    }
    // wall
    fc.strokeStyle = PAL.border; fc.lineWidth = CONFIG.BORDER * 2; fc.strokeRect(0, 0, CONFIG.W, CONFIG.H);
    fc.strokeStyle = '#3d4257'; fc.lineWidth = 2; fc.strokeRect(CONFIG.BORDER, CONFIG.BORDER, CONFIG.W - CONFIG.BORDER * 2, CONFIG.H - CONFIG.BORDER * 2);
    // the four gates are static art: stamped once here, the amber glow flickers over them per frame
    for (const g of gates()) drawGate(fc, g.x, g.y, 1, g.compass, 0);
  }
  function gates() {
    const B = CONFIG.BORDER, W = CONFIG.W, H = CONFIG.H;
    return [
      { side: 'top', compass: 'N', x: W / 2, y: B / 2 },
      { side: 'bottom', compass: 'S', x: W / 2, y: H - B / 2 },
      { side: 'left', compass: 'W', x: B / 2, y: H / 2 },
      { side: 'right', compass: 'E', x: W - B / 2, y: H / 2 },
    ];
  }
  function stamp(fn) {
    fc.save();
    try { const B = CONFIG.BORDER; fc.beginPath(); fc.rect(B, B, CONFIG.W - 2 * B, CONFIG.H - 2 * B); fc.clip(); fn(fc); }
    finally { fc.restore(); }
  }
  function draw(c) { c.drawImage(cv, 0, 0, CONFIG.W, CONFIG.H); }
  return { build, stamp, draw, gates };
})();

// ===================================================================== ENTITIES
function newPlayer() {
  return {
    x: CONFIG.W / 2, y: CONFIG.H / 2, r: CONFIG.NUN_R, kvx: 0, kvy: 0,
    aim: 0, aimX: 1, aimY: 0, aimDist: 100, facing: 1,
    hp: CONFIG.HEARTS, maxHp: CONFIG.HEARTS, iframes: 0, god: false,
    stretch: 0, gunKick: 0, gunSlide: 0, gunSlideV: 0, walkT: 0, moving: false,
    // the veil trails 3 stored positions behind the head, drawn as a tapering polygon
    veil: [{ x: CONFIG.W / 2, y: CONFIG.H / 2 }, { x: CONFIG.W / 2, y: CONFIG.H / 2 }, { x: CONFIG.W / 2, y: CONFIG.H / 2 }],
    gun: { state: 'READY', timer: 0, shells: CONFIG.SHELLS, pumped: false, holdBlock: true, buffered: false },
    stats: {
      pellets: CONFIG.PELLETS, spread: CONFIG.SPREAD_DEG, pelletSpeed: CONFIG.PELLET_SPEED, pelletLife: CONFIG.PELLET_LIFE, fullT: CONFIG.PELLET_FULL_T,
      pumpT: CONFIG.PUMP_T, shells: CONFIG.SHELLS, shellT: CONFIG.SHELL_T, recoil: 1, knock: 1, pierce: 0, bounce: 0,
      lastRites: false, thunder: false,
    },
  };
}

// how far a pellet still kills: the reticle's hot ring, and where the touch reticle sits
const killRangeOf = (p) => p.stats.pelletSpeed * p.stats.fullT + CONFIG.KILL_RANGE_PAD;
function updatePlayer(dt) {
  const p = G.player;
  // aim: the mouse on desktop, the right thumb stick on touch (parked at kill range so the hot/cold cue holds)
  if (Touch.on) {
    const a = Touch.aimAng;
    p.aimX = Math.cos(a); p.aimY = Math.sin(a); p.aimDist = killRangeOf(p); p.aim = a; p.facing = p.aimX < 0 ? -1 : 1;
  } else {
    const [ax, ay, ad] = norm(Input.mouse.x - p.x, Input.mouse.y - p.y);
    p.aimX = ax; p.aimY = ay; p.aimDist = ad; p.aim = Math.atan2(ay, ax); p.facing = ax < 0 ? -1 : 1;
  }
  // move + knock
  const [nx, ny, moving] = Input.moveVec();
  p.moving = moving; if (moving) p.walkT += dt;
  p.x += (nx * CONFIG.NUN_SPEED + p.kvx) * dt;
  p.y += (ny * CONFIG.NUN_SPEED + p.kvy) * dt;
  p.kvx *= CONFIG.FRICTION; p.kvy *= CONFIG.FRICTION;
  // clamp to the arena; kill knock velocity into the wall
  const B = CONFIG.BORDER + p.r;
  if (p.x < B) { p.x = B; if (p.kvx < 0) p.kvx = 0; } else if (p.x > CONFIG.W - B) { p.x = CONFIG.W - B; if (p.kvx > 0) p.kvx = 0; }
  if (p.y < B) { p.y = B; if (p.kvy < 0) p.kvy = 0; } else if (p.y > CONFIG.H - B) { p.y = CONFIG.H - B; if (p.kvy > 0) p.kvy = 0; }
  if (p.iframes > 0) p.iframes -= dt;
  p.stretch *= 0.82; p.gunKick *= 0.78;
  // veil: a 3-link chain lagging behind the head anchor
  let hx = p.x, hy = p.y + NUN_FOOT - VEIL_ANCHOR;
  for (const v of p.veil) { v.x = lerp(v.x, hx, VEIL_LAG); v.y = lerp(v.y, hy, VEIL_LAG); hx = v.x; hy = v.y; }
  // the pump block is a spring, not a decay: it snaps back and overshoots forward, so the rack reads at 1x
  p.gunSlideV += (-CONFIG.SLIDE_K * p.gunSlide - CONFIG.SLIDE_DAMP * p.gunSlideV) * dt;
  p.gunSlide += p.gunSlideV * dt;
  updateGun(dt);
}

// gun state machine: READY / PUMPING / LOADING. Hold LMB to fire at pump rate; a shot is allowed mid-reload the moment one shell is in.
function updateGun(dt) {
  const p = G.player, g = p.gun, s = p.stats;
  // a button already held when PLAYING begins (title click, card pick) must not fire until released once
  if (!Input.fireHeld()) g.holdBlock = false;
  // a tap in the last FIRE_BUFFER_T of the pump (or of the shell going in) is remembered and fires the instant the gun is ready
  if (Input.firePressed() && g.state !== 'READY' && g.timer <= CONFIG.FIRE_BUFFER_T) g.buffered = true;
  const wantFire = Input.firePressed() || (Input.fireHeld() && !g.holdBlock) || g.buffered;
  if (g.state === 'READY') {
    if (wantFire && g.shells > 0) fire(); // fire() eats the buffer, so a buffered tap can never double up with the hold
    else { g.buffered = false; if (g.shells === 0 || (Input.pressed('KeyR') && g.shells < s.shells)) { g.state = 'LOADING'; g.timer = s.shellT; } }
  } else if (g.state === 'PUMPING') {
    g.timer -= dt;

  const frac = budget > 0 ? clamp(spent / budget, 0, 1) : 1;

// locked until earned (spec §8); 'hardhabit' is an unlock but not a card

// ------------------------------------------------- the on-screen keyboard
// A virtual keyboard does not resize the window: it shrinks the VISUAL viewport and leaves the
// layout viewport where it was. window.visualViewport is the only thing that sees it, so that is
// what we watch. While it is up the whole entry block is redrawn in SCREEN space inside whatever
// is left of the glass - everything else would be under the keys.
const KB = { on: false, x: 0, y: 0, w: 0, h: 0, forced: 0 };
function kbLayoutH() { try { return Math.max(1, window.innerHeight || (document.documentElement && document.documentElement.clientHeight) || 1); } catch (e) { return 1; } }
function kbRead() {
  const vv = window.visualViewport;
  if (KB.forced > 0) {   // the harness: a fake visible rect, since CDP cannot shrink a real one
    KB.x = 0; KB.y = 0; KB.w = View.cssW; KB.h = KB.forced;
    KB.on = KB.forced < kbLayoutH() * CONFIG.KB_SHRINK;
    return;
  }
  if (!vv) { KB.on = false; return; }
  KB.x = vv.offsetLeft || 0; KB.y = vv.offsetTop || 0;
  KB.w = vv.width || View.cssW; KB.h = vv.height || View.cssH;
  KB.on = KB.h < kbLayoutH() * CONFIG.KB_SHRINK;
}
// iOS scrolls the PAGE to bring a focused input into view, which slides the canvas out from under
// the finger. Pin it: nothing on this page ever scrolls.
function kbPin() {
  try { document.documentElement.style.overflow = 'hidden'; } catch (e) { /* no document */ }
  try { window.scrollTo(0, 0); } catch (e) { /* nothing to scroll */ }
}
(function watchViewport() {
  const vv = window.visualViewport;
  if (!vv) return;
  const onChange = () => { kbRead(); kbPin(); syncNameInput(); };
  try { vv.addEventListener('resize', onChange); vv.addEventListener('scroll', onChange); } catch (e) { /* older engine: the normal layout stands */ }
})();
// the entry block moves to screen space only while a keyboard is actually covering the card
function kbEntryUp() { return !!(KB.on && nameEntryActive()); }
// every rect here is CSS px of the SCREEN (== the canvas, which is the layout viewport in touch mode)
function kbLayout() {

  const fw = Math.min(CONFIG.KB_FIELD_W, KB.w - 40), fh = CONFIG.KB_FIELD_H, ph = CONFIG.KB_PILL_H;
  const y0 = KB.y + m;
  const field = { x: cx - fw / 2, y: y0 + 18, w: fw, h: fh };
  const py = field.y + fh + 8, g = 14;
  return {
    rect: { x: KB.x, y: KB.y, w: KB.w, h: KB.h },
    titleY: y0 + 11,
    field,
    submit: { x: cx - g / 2 - 104, y: py, w: 104, h: ph },
    skip: { x: cx + g / 2, y: py, w: 84, h: ph },
    hintY: py + ph + 14,
  };
}

// ------------------------------------------------- the name entry (GAMEOVER and WIN)
// ONE wide field, not three arcade slots: names run to twelve characters now. Desktop types into
// it directly; a phone taps it, which focuses a real <input> parked exactly over the drawn field
// (iOS will not raise a keyboard for anything else) and every keystroke arrives as an `input`
// event - a virtual keyboard's keydown is keyCode 229 and tells us nothing at all.
function newEntry() { return { active: false, done: false, sent: false, pending: false, name: '', msg: '', rank: 0, sentName: '', sentScore: 0, closedT: -1e9 }; }
function nameEntryActive() { return !!(G && G.entry && G.entry.active); }
// the block's top edge: under the score on either card, where the board would otherwise sit
function entryBaseY() { return G && G.state === 'WIN' ? 196 : (G ? G.overQY : 84) + 124; }
function entryLayout() {
  const W = CONFIG.W, fw = CONFIG.LB_FIELD_W, fh = CONFIG.LB_FIELD_H, y = entryBaseY();
  const py = y + fh + 14, ph = CONFIG.LB_PILL_H, g = CONFIG.LB_PILL_GAP;
  return {
    y,
    field: { x: W / 2 - fw / 2, y, w: fw, h: fh },
    submit: { x: W / 2 - g / 2 - 116, y: py, w: 116, h: ph },
    skip: { x: W / 2 + g / 2, y: py, w: 96, h: ph },
    hintY: py + ph + 20,

}
const inRect = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
// the field in SCREEN px, wherever it happens to be drawn this frame

  const kb = kbLayout();
  if (kb) return kb.field;
  const f = entryLayout().field;
  return { x: View.offsetX + f.x * View.scale, y: View.offsetY + f.y * View.scale, w: f.w * View.scale, h: f.h * View.scale };
}

// the hidden <input>. Built on demand, never while the entry is down, and always parked over the

let nameInput = null;
function nameInputEl() {

  const el = nameInputEl(), r = entryFieldScreen();
  el.style.display = 'block';
  el.style.left = r.x + 'px';
  el.style.top = r.y + 'px';
  el.style.width = Math.max(40, r.w) + 'px';
  el.style.height = Math.max(24, r.h) + 'px';
}
function hideNameInput() {

}
// a tap heading for SKIP must not be turned into a submit by the blur it causes: pointerdown runs

let skipArmedT = -1e9;
function nameEntryPointerDown(cx, cy) {

function entryQualifies() {

}

function updateNameEntry() {
  const e = G.entry;
  kbRead();
  syncNameInput();
  // SUBMIT and SKIP are named UI targets, wherever the keyboard has pushed them: press and release
  // on the same pill, and never from a finger that was already down when this card arrived
  if (uiTapped('entry:submit')) { submitEntry(); return; }
  if (uiTapped('entry:skip')) { skipEntry(); return; }
  // the hidden input has the caret: its own listeners mirror every keystroke into the field
  if (nameInput && document.activeElement === nameInput) return;
  // EVERY key that landed this tick, in the order it landed: a fast typist must not lose letters
  for (const code of Array.from(Input.justPressed)) {
    if (code === 'Enter') { submitEntry(); return; }
    if (code === 'Escape') { skipEntry(); return; }
    if (code === 'Backspace') { entryBack(); continue; }
    if (code === 'Space') { entryPut(' '); continue; }
    if (code.length === 4 && code.slice(0, 3) === 'Key') { entryPut(code.charAt(3)); continue; }

const QUOTES = ['Goodnight, sweet nun.', 'Alas, poor Ophelia.', 'Get thee BACK to a nunnery.', 'Frailty, thy name is three hearts.', 'Something is rotten in Denmark. Mostly you.', 'The rest is silence. Until you click.'];
STATES.GAMEOVER = {
  enter() {
    Input.endTick();

    G.quote = charQuote(pick(QUOTES), G.character); G.overT = 0;   // the priest is never a sweet nun

    G.overQY = overQuoteY(ctx, G.quote);
    beginNameEntry();
    if (!G.entry.active) LB.fetchTop();   // no entry to offer: go straight to showing her the board
    Audio.gameover();
  },
  exit() { hideNameInput(); },
  update(dt) {
    G.overT += dt;
    if (G.entry.active) { updateNameEntry(); return; }   // Enter submits; the retry flow waits its turn
    // ...and the Enter/Esc that closed the entry is NOT a retry: hold still and let her see the board
    if (RT - G.entry.closedT < CONFIG.LB_ENTRY_LOCK) return;

STATES.WIN = {

  },

  update(dt) {

// ===================================================================== MAIN
function safeUpdate(dt) {
  try {
    debugKeys();
    STATES[G.state].update(dt);
  } catch (err) {
    console.error('update failed', err);
    try { if (G.state !== 'GAMEOVER') setState('GAMEOVER'); } catch (e2) { /* nothing left to do */ }
  }
  Input.endTick();
}
let drawFails = 0;
function draw() {
  const d = View.dpr;
  // 1. the whole canvas. On touch that is the whole screen, and the bars start as darkened stone.
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.fillStyle = View.full ? PAL.bar : PAL.floor;
  ctx.fillRect(0, 0, View.cssW, View.cssH);
  // 2. the 960x540 courtyard, letterboxed inside the canvas by one transform. Everything the game
  //    draws (HUD included) is in these logical px and never needs to know where the glass ends.
  const s = View.scale * d;
  ctx.setTransform(s, 0, 0, s, View.offsetX * d, View.offsetY * d);
  ctx.fillStyle = PAL.floor; ctx.fillRect(0, 0, CONFIG.W, CONFIG.H);
  try { STATES[G.state].draw(ctx); drawFails = 0; }
  catch (err) {
    if (drawFails++ === 0) console.error('draw failed', err);   // log the streak once, not every frame
    try { ctx.restore(); } catch (e2) { /* the throw may have left a save() open */ }
    try { if (G.state !== 'GAMEOVER') setState('GAMEOVER'); } catch (e2) { /* nothing left to do */ }
  }
  drawDebug(ctx);
  // 3. screen space: the bars (which also crop the camera shake), the rotate card, and the thumbs
  ctx.setTransform(d, 0, 0, d, 0, 0);
  drawBars(ctx);
  if (rotateBlocked()) drawRotateScreen(ctx);   // the overlay eats every touch: no live buttons under it
  else { drawTouchUI(ctx); drawEntryOverlay(ctx); }   // the keyboard-up entry block owns the glass
}
let last = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const t0 = performance.now();
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0) || dt > CONFIG.DT_CLAMP) dt = Math.min(Math.max(dt, 0), CONFIG.DT_CLAMP);
  // fps
  RT += dt;
  Perf._frames++; Perf._acc += dt; if (Perf._acc >= 0.5) { Perf.fps = Perf._frames / Perf._acc; Perf._frames = 0; Perf._acc = 0; }
  // render-time systems: shake, kick, flashes, slow-mo timer, the music scheduler
  FX.tickRender(dt);
  decalBudget = CONFIG.DECALS_PER_FRAME;
  Music.set(G.state === 'PLAYING' ? 'play' : G.state === 'TITLE' || G.state === 'VOWS' || G.state === 'UPGRADE' ? 'drone' : 'off', G.wave || 1);
  Music.update();
  // portrait phone: the whole sim holds behind the ROTATE overlay, and picks up where it left off
  if (rotateBlocked()) { clearTouch(); hideNameInput(); Input.endTick(); acc = 0; draw(); Perf.frameMs = Perf.frameMs * 0.9 + (performance.now() - t0) * 0.1; return; }
  if (G.slowmoT > 0) { G.slowmoT -= dt; if (G.slowmoT <= 0) G.timeScale = G.baseTimeScale; }
  // wave-end and boss-death slow-mo run on render time, so 0.4 s means 0.4 s no matter how slow the sim is
  if (G.state === 'PLAYING') {
    if (G.waveEndT > 0) { G.waveEndT -= dt; if (G.waveEndT <= 0) finishWave(); }
    else if (G.winT > 0) { G.winT -= dt; if (G.winT <= 0) finishBoss(); }
  }
  acc += dt * G.timeScale;
  let steps = 0;
  while (acc >= CONFIG.TICK && steps < CONFIG.MAX_STEPS) {
    acc -= CONFIG.TICK; steps++;
    if (G.state === 'PLAYING' && G.hitstop > 0) { G.hitstop--; continue; } // sim frozen, input buffered
    safeUpdate(CONFIG.TICK);
  }
  if (steps >= CONFIG.MAX_STEPS) acc = 0;
  draw();
  Perf.frameMs = Perf.frameMs * 0.9 + (performance.now() - t0) * 0.1;
}
function boot() {
  Save.load(); Audio.setMuted(Save.data.mute);
  Touch.mode = Save.data.touchFire === 'hold' ? 'hold' : 'flick';   // the fire mode outlives the run
  G = newGame();
  FX.prerender(); buildSprites(); Floor.build(); resize();
  if (coarsePointer()) setTouchMode(true);
  setState('TITLE');
  requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });
}
boot();
</script>
