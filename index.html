  MUZZLE_OFF: 30, GUN_LEN: 34, GUN_SLIDE_PX: 5, SLIDE_K: 900, SLIDE_DAMP: 22, // the pump block: 5 px back, sprung forward

  BLAST_NOISE_DUR: 0.30, BLAST_NOISE_SWEEP: 0.16, BLAST_SINE_DUR: 0.30, BLAST_SINE_PEAK: 1.3, BLAST_TRI_DUR: 0.26,

  BURST_FIRST: 1.3, BURST_FIRST_STEP: 0.25, BURST_FIRST_MIN: 0.8, BURST_MIN: 2, BURST_MAX: 3,
  TELEGRAPH_T: 0.5, GATE_IN: 34, GATE_JITTER: 16, BOSS_GATE_IN: 74,
  COST_RESTLESS: 1, COST_YORICK_PACK: 4, COST_GRAVEDIGGER: 4, COST_GHOST: 5,
  WAVE_YORICK: 3, WAVE_GRAVEDIGGER: 5, WAVE_GHOST: 6,
  PACK_MIN: 8, PACK_MAX: 12, PACK_GROW: 1, PACK_SPAN: 2, PACK_SPREAD: 26, WOBBLE_AMP: 0.55, WOBBLE_FREQ: 6,
  WAVE_END_SLOWMO: 0.3, WAVE_END_T: 0.4, WAVE_CARD_T: 2.0, WAVE_CARD_Y: 0.30, WAVE_BONUS: 100, ENCORE_STEP: 0.1,
  BOSS_WIN_SLOWMO: 0.22, BOSS_WIN_T: 1.2, RETRY_LOCK: 0.25,
  // blessings (spec §7): every coefficient the ten cards move
  BUCKSHOT_PELLETS: 3, SAWNOFF_SPREAD: 12, SAWNOFF_KNOCK: 1.5, SAWNOFF_LIFE: 0.8,
  HAILMARY_SHELLS: 2, VESPERS_MULT: 0.75, WRATH_RECOIL: 1.6, GRACE_HEARTS: 1,
  OLDTEST_PIERCE: 1, RICOCHET_BOUNCE: 1, LASTRITES_SHELLS: 2,
  THUNDER_EVERY: 4, THUNDER_KNOCK: 2, THUNDER_SHAKE: 10,
  CARDS_N: 3, CARD_W: 224, CARD_H: 286, CARD_GAP: 36, CARD_Y: 118, CARD_LIFT: 10,
  CARD_OWNED_DY: 62, CARD_OWNED_FS: 12, CARD_OWNED_FS_MIN: 8, // the OWNED build line under the keycaps
  // unlocks and HARD HABIT (spec §8)
  UNLOCK_WAVE: 5, UNLOCK_KILLS: 500, UNLOCK_RUNS: 3, UNLOCK_WINS: 1,
  HARD_WAVE: 4, HARD_HEARTS: 2, HARD_MULT: 1.5, HARD_PILL_W: 214, HARD_PILL_H: 34, HARD_PILL_X: 66, HARD_PILL_Y: 388,
  // the Ghost (spec §5): enters on the border point behind the player's aim, wave 6+, dissolves upward
  GHOST_ALPHA: 0.72, GHOST_WAVER_AMP: 0.32, GHOST_WAVER_FREQ: 2.4, GHOST_WISPS: 14, GHOST_RISE: -260, GHOST_FADE_T: 1.0,
  // music (spec §12 last row): own gain ~12 dB under the sfx bus, ducked on every shot
  MUSIC_GAIN: 0.18, MUSIC_DUCK: 0.5, MUSIC_DUCK_T: 0.15, MUSIC_DUCK_CHOIR: 0.35, MUSIC_DUCK_CHOIR_T: 0.9,
  MUSIC_ROOT: 55, MUSIC_DRONE_MUL: 2, MUSIC_DRONE_GAIN: 0.55, MUSIC_DRONE_CUT: 240, MUSIC_DETUNE: 8,
  MUSIC_BPM: 96, MUSIC_LOOKAHEAD: 0.1, MUSIC_STEPS: 16, MUSIC_ARP_OCT: 3, MUSIC_FADE: 0.5, MUSIC_IDLE: 3,
  MUSIC_CUT_BASE: 700, MUSIC_CUT_PER: 150, MUSIC_CUT_MAX: 3400, MUSIC_CUT_Q: 5,
  MUSIC_DENS_BASE: 0.35, MUSIC_DENS_PER: 0.06, MUSIC_DENS_MAX: 0.95,
  MUSIC_NOTE_T: 0.17, MUSIC_NOTE_GAIN: 0.16,
  // low-HP heartbeat (juice §13.15) and the wave-card slam
  HEARTBEAT_HP: 1, HEARTBEAT_T: 1.05, LOWHP_VIG: 0.16, WAVE_SLAM_SHAKE: 4, WAVE_SLAM_BELL: 0.5,
  // reticle + HUD readability (fixes 2, 9, 14)
  RETICLE_R_MIN: 9, RETICLE_R_MAX: 60, RETICLE_HOT_PAD_DEG: 6, MULT_SHOW_MIN: 1.001,
  // pickups
  HEART_HEAL: 1, HEART_R: 10, HEART_LIFE: 14, HEART_BLINK: 3, HEART_DROP: 0.3,
  // debug drip spawner (GAME.debugSpawn only; the wave system owns the real spawns)
  SPAWN_EVERY: 2, SPAWN_N: 2,
};

const PAL = {
  // spec §11 verbatim
  floor: '#1b1f3a', stone: '#151830', border: '#5a6078', amber: '#ffb347',
  green: '#7bd389', greenShade: '#4f9a5c', bone: '#f4f0e6', cyan: '#8fe3ff',
  muzzle: '#fff3c4', cream: '#f4f0e6', purple: '#7b3fa0', gold: '#ffd166', brass: '#d9a441',
  skin: '#f2c29b', red: '#c0392b', smoke: '#8a8fa8',
  // the Designer's additions (docs/jam/art/sprites-scratch.html): all tones OF the palette, no new hues
  ink: '#07070d',            // the 2 px outline on every body
  habit: '#262633',          // the habit is CHARCOAL: pure black is a hole in the indigo floor
  habitHi: '#3c3c4e', eye: '#14141c', shoe: '#111118',
  gunDark: '#2b2e3a', gunHi: '#4d515f', stock: '#6b4226', stockHi: '#8a5a34', pump: '#8a8f9c',
  boneShade: '#cfc9ba', greyGreen: '#8a9c8c', greyGreenShade: '#5d6f60',
  purpleShade: '#56297a', paleFace: '#d8c3e0', ghost: '#8fe3ff', ghostShade: '#5fb5d6',
  heart: '#e0475a', heartHi: '#ff8a96', brassDark: '#a87a2c', borderHi: '#7c8398', gateDark: '#0d0f1c',
  shadow: 'rgba(0,0,0,0.35)',
};
const FAM_SERIF = 'Georgia, "Times New Roman", serif';
const FAM_SANS = '-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif';
// CSS shorthand wants the weight BEFORE the size, or the whole declaration is dropped
const FSERIF = (px, italic) => (italic ? 'italic ' : '') + 'bold ' + px + 'px ' + FAM_SERIF;
const FSANS = (px, regular) => (regular ? '' : 'bold ') + px + 'px ' + FAM_SANS;
const VERSION = '1.0.0-m8';

// ===================================================================== UTIL
const TAU = Math.PI * 2;
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const randi = (n) => Math.floor(Math.random() * n);
const pick = (arr) => arr[randi(arr.length)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const fmt = (n) => Math.round(n || 0).toLocaleString('en-US');
// normalise; zero-length vectors return a safe unit x so nothing ever goes NaN
function norm(x, y) { const d = Math.hypot(x, y); return d > 1e-6 ? [x / d, y / d, d] : [1, 0, 0]; }
function font(px, serif) { return serif ? FSERIF(px) : FSANS(px); }
function text(c, str, x, y, px, color, align = 'center', serif = false, base = 'middle') {
  c.font = font(px, serif); c.fillStyle = color; c.textAlign = align; c.textBaseline = base; c.fillText(str, x, y);
}
function makeCanvas(w, h) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; return cv; }
// render-time clock: advances every frame in every state, so pulses and torch flicker never stop
let RT = 0;
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const easeOutBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
const pulse = (t, hz, lo, hi) => lo + (hi - lo) * (0.5 + 0.5 * Math.sin(t * hz * TAU));

// ---- UI primitives (lifted from the Designer's ui-scratch.html: rrect/ell/rgba + letter-spaced text)
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
// rounded-rect path with an arc-based fallback for engines without ctx.roundRect
function rpath(c, x, y, w, h, r) {
  if (c.roundRect) { c.beginPath(); c.roundRect(x, y, w, h, r); return; }
  const k = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  c.beginPath(); c.moveTo(x + k, y);
  c.arcTo(x + w, y, x + w, y + h, k); c.arcTo(x + w, y + h, x, y + h, k);
  c.arcTo(x, y + h, x, y, k); c.arcTo(x, y, x + w, y, k); c.closePath();
}
function rrect(c, x, y, w, h, r, fill, stroke, lw) {
  rpath(c, x, y, w, h, r);
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.lineWidth = lw || 2; c.strokeStyle = stroke; c.stroke(); }
}
function ell(c, x, y, rx, ry, fill, stroke, lw, rot) {
  c.beginPath(); c.ellipse(x, y, rx, ry, rot || 0, 0, TAU);
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.lineWidth = lw || 2; c.strokeStyle = stroke; c.stroke(); }
}
// letter spacing is done by hand (per-glyph fillText) so it works everywhere; uiMeasure matches it
function uiMeasure(c, str, f, spacing) { c.font = f; return c.measureText(str).width + (spacing || 0) * Math.max(0, str.length - 1); }
// opts: { spacing, shadow (px offset, drawn in ink first), stroke (px, ink under the fill), baseline }
function uiText(c, str, x, y, f, color, align, opts) {
  opts = opts || {};
  const sp = opts.spacing || 0, w = uiMeasure(c, str, f, sp);
  const sx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  c.font = f; c.textAlign = 'left'; c.textBaseline = opts.baseline || 'alphabetic';
  const run = (d, mode, col) => {
    if (mode === 'fill') c.fillStyle = col; else { c.strokeStyle = col; c.lineWidth = opts.stroke; c.lineJoin = 'round'; }
    let cx = sx + d;
    if (!sp) { mode === 'fill' ? c.fillText(str, cx, y + d) : c.strokeText(str, cx, y + d); return; }
    for (const ch of str) { mode === 'fill' ? c.fillText(ch, cx, y + d) : c.strokeText(ch, cx, y + d); cx += c.measureText(ch).width + sp; }
  };
  if (opts.shadow) run(opts.shadow, 'fill', opts.shadowColor || PAL.ink);
  if (opts.stroke) run(0, 'stroke', opts.strokeColor || PAL.ink);
  run(0, 'fill', color);
  return w;
}
function uiWrap(c, str, f, maxW) {
  c.font = f; const out = []; let cur = '';
  for (const wd of str.split(' ')) { const tr = cur ? cur + ' ' + wd : wd; if (c.measureText(tr).width > maxW && cur) { out.push(cur); cur = wd; } else cur = tr; }
  if (cur) out.push(cur); return out;
}
function pill(c, x, y, w, h, a) { rrect(c, x, y, w, h, Math.min(h / 2, 10), 'rgba(7,7,13,' + (a == null ? 0.55 : a) + ')'); }
function keycap(c, x, y, ch, size) {
  size = size || 22;
  rrect(c, x, y + 2, size, size, 4, 'rgba(0,0,0,0.5)');
  rrect(c, x, y, size, size, 4, '#22233a', rgba(PAL.cream, 0.55), 1.5);
  uiText(c, ch, x + size / 2, y + size * 0.72, FSANS(Math.round(size * 0.55)), PAL.cream, 'center');
}
function dim(c, a) { c.fillStyle = 'rgba(7,7,13,' + a + ')'; c.fillRect(0, 0, CONFIG.W, CONFIG.H); }
function rule(c, x, y, w, color) { c.fillStyle = color || PAL.amber; c.fillRect(x, y, w, 2); }

// canvas + letterbox viewport
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const View = { scale: 1, offsetX: 0, offsetY: 0, dpr: 1 };
function resize() {
  const iw = window.innerWidth || CONFIG.W, ih = window.innerHeight || CONFIG.H;
  const s = Math.min(iw / CONFIG.W, ih / CONFIG.H);
  View.scale = s; View.dpr = Math.min(window.devicePixelRatio || 1, CONFIG.DPR_CAP);
  const cw = CONFIG.W * s, ch = CONFIG.H * s;
  View.offsetX = Math.floor((iw - cw) / 2); View.offsetY = Math.floor((ih - ch) / 2);
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  canvas.style.left = View.offsetX + 'px'; canvas.style.top = View.offsetY + 'px';
  canvas.width = Math.max(1, Math.round(cw * View.dpr)); canvas.height = Math.max(1, Math.round(ch * View.dpr));
  Input.refreshMouse();
}
window.addEventListener('resize', resize);

// persistence: localStorage with an in-memory fallback, never throws
const Save = (() => {
  const KEY = 'nunnery.v1';
  const def = () => ({ hi: 0, bestWave: 0, kills: 0, runs: 0, wins: 0, unlocks: [], mute: false });
  let data = def();
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const o = JSON.parse(raw); const d = def(); for (const k in d) if (o && typeof o[k] === typeof d[k]) d[k] = o[k]; data = d; }
    } catch (e) { data = def(); }
    return data;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* private mode / quota: keep in memory */ } }
  return { get data() { return data; }, load, save };
})();

// ===================================================================== INPUT
// Listeners on window so aim works over the letterbox bars and CDP-dispatched events land without focus.
const Input = (() => {
  const keys = new Set(), justPressed = new Set();
  const mouse = { x: CONFIG.W / 2, y: CONFIG.H / 2, cx: 0, cy: 0, down: false, justDown: false };
  const PREVENT = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab']);
  function toLogical(cx, cy) { return [(cx - View.offsetX) / View.scale, (cy - View.offsetY) / View.scale]; }
  function refreshMouse() { [mouse.x, mouse.y] = toLogical(mouse.cx, mouse.cy); }
  window.addEventListener('keydown', (e) => {
    if (!keys.has(e.code)) justPressed.add(e.code);
    keys.add(e.code);
    if (PREVENT.has(e.code)) e.preventDefault();
    Audio.unlock();
  });
  window.addEventListener('keyup', (e) => { keys.delete(e.code); });
  window.addEventListener('mousemove', (e) => { mouse.cx = e.clientX; mouse.cy = e.clientY; refreshMouse(); });
  window.addEventListener('mousedown', (e) => {
    mouse.cx = e.clientX; mouse.cy = e.clientY; refreshMouse();
    if (e.button === 0) { mouse.down = true; mouse.justDown = true; }
    Audio.unlock();
  });
  window.addEventListener('mouseup', (e) => { if (e.button === 0) mouse.down = false; });
  window.addEventListener('contextmenu', (e) => e.preventDefault());
  function clear() { keys.clear(); justPressed.clear(); mouse.down = false; mouse.justDown = false; }
  // focus loss clears every held key (no stuck movement) and pauses; a hidden tab also stops the audio
  // graph until the next input, which calls Audio.unlock() and resumes it.
  window.addEventListener('blur', () => { clear(); onFocusLost(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { clear(); onFocusLost(); Audio.suspend(); } });
  function endTick() { justPressed.clear(); mouse.justDown = false; }
  const pressed = (code) => justPressed.has(code);
  const held = (code) => keys.has(code);
  function axis() {
    let x = 0, y = 0;
    if (keys.has('KeyA') || keys.has('ArrowLeft')) x -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) x += 1;
    if (keys.has('KeyW') || keys.has('ArrowUp')) y -= 1;
    if (keys.has('KeyS') || keys.has('ArrowDown')) y += 1;
    return [x, y];
  }
  const anyStart = () => mouse.justDown || justPressed.has('Enter') || justPressed.has('Space');
  return { keys, justPressed, mouse, clear, endTick, pressed, held, axis, anyStart, refreshMouse };
})();

// ===================================================================== AUDIO
// All synthesized. Chain: sfx -> tanh shaper -> compressor -> master -> out. Music has its own gain into the compressor.
// Nothing here may throw into game logic: every public call is wrapped.
const Audio = (() => {
  let ac = null, sfx, shaper, comp, master, musicGain, noise;
  let muted = false;
  const recent = {};
  const MASTER = 0.8;
  function tanhCurve() { const n = 1024, c = new Float32Array(n); for (let i = 0; i < n; i++) { const x = (i / (n - 1)) * 2 - 1; c[i] = Math.tanh(x * 1.6) / Math.tanh(1.6); } return c; }
  function build() {
    master = ac.createGain(); master.gain.value = muted ? 0 : MASTER;
    comp = ac.createDynamicsCompressor();
    comp.threshold.value = CONFIG.COMP_THRESH; comp.ratio.value = CONFIG.COMP_RATIO; comp.attack.value = CONFIG.COMP_ATTACK; comp.release.value = CONFIG.COMP_RELEASE; comp.knee.value = CONFIG.COMP_KNEE;
    shaper = ac.createWaveShaper(); shaper.curve = tanhCurve(); shaper.oversample = 'none';
    sfx = ac.createGain(); sfx.gain.value = 0.7; // headroom: only stacked blasts drive the shaper into grit
    sfx.connect(shaper); shaper.connect(comp); comp.connect(master); master.connect(ac.destination);
    musicGain = ac.createGain(); musicGain.gain.value = CONFIG.MUSIC_GAIN; musicGain.connect(comp);
    noise = ac.createBuffer(1, Math.floor(ac.sampleRate * 2), ac.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function unlock() {
    try {
      if (!ac) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; ac = new AC(); build(); }
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { /* audio is optional */ }
  }
  // alt-tab: the whole graph stops until the next input, which calls unlock() and resumes it
  function suspend() { try { if (ac && ac.state === 'running') ac.suspend(); } catch (e) { /* ignore */ } }
  function ready() { return !!ac && ac.state === 'running' && !muted; }
  // voice cap: at most 4 of a sound per 50 ms; stacked instances get a little louder instead
  function voice(name) {
    if (!ready()) return 0;
    const now = ac.currentTime, arr = recent[name] || (recent[name] = []);
    while (arr.length && now - arr[0] > 0.05) arr.shift();
    if (arr.length >= 4) return 0;
    arr.push(now);
    return 1 + arr.length * 0.12;
  }
  const jit = () => 1 + (Math.random() - 0.5) * 0.12;
  function env(g, t0, peak, dur) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(Math.max(0.0002, peak), t0 + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  }
  // o = { type, f0, f1, sweep, dur, peak, t }
  function osc(o) {
    const t0 = o.t, s = ac.createOscillator(); s.type = o.type || 'sine';
    s.frequency.setValueAtTime(Math.max(1, o.f0), t0);
    if (o.f1 !== undefined && o.f1 !== o.f0) s.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t0 + (o.sweep || o.dur));
    const g = ac.createGain(); env(g, t0, o.peak, o.dur);
    s.connect(g); g.connect(o.dest || sfx); s.start(t0); s.stop(t0 + o.dur + 0.03);
  }
  // n = { t, dur, peak, type, f0, f1, sweep, q }
  function noiseBurst(n) {
    const t0 = n.t, s = ac.createBufferSource(); s.buffer = noise; s.loop = true; s.playbackRate.value = jit();
    s.loopStart = Math.random() * 1.5;
    const f = ac.createBiquadFilter(); f.type = n.type || 'bandpass'; f.Q.value = n.q || 1;
    f.frequency.setValueAtTime(Math.max(20, n.f0), t0);
    if (n.f1) f.frequency.exponentialRampToValueAtTime(Math.max(20, n.f1), t0 + (n.sweep || n.dur));
    const g = ac.createGain(); env(g, t0, n.peak, n.dur);
    s.connect(f); f.connect(g); g.connect(n.dest || sfx); s.start(t0, s.loopStart); s.stop(t0 + n.dur + 0.03);

  // duck the music bus to `mult` of its resting level and bring it back over `back` seconds
  function duck(mult, back) {
    if (!musicGain) return; const t = ac.currentTime;
    musicGain.gain.cancelScheduledValues(t); musicGain.gain.setValueAtTime(musicGain.gain.value, t);
    musicGain.gain.linearRampToValueAtTime(CONFIG.MUSIC_GAIN * mult, t + 0.01);
    musicGain.gain.linearRampToValueAtTime(CONFIG.MUSIC_GAIN, t + back);

  // ---- sounds (filled in as the systems land)
  const S = {};
  S.click = () => { const v = voice('click'); if (!v) return; const t = ac.currentTime; osc({ type: 'sine', f0: 1200, f1: 900, dur: 0.05, peak: 0.25 * v, t }); noiseBurst({ t, dur: 0.012, peak: 0.2 * v, type: 'highpass', f0: 3000 }); };
  // THE BLAST. click transient + bandpass-swept noise + sine thump + triangle body, all jittered, then the bus shaper adds grit.
  S.blast = () => {
    const v = voice('blast'); if (!v) return; const t = ac.currentTime, j = jit();
    noiseBurst({ t, dur: 0.008, peak: 0.9 * v, type: 'highpass', f0: 3000, q: 0.7 });
    noiseBurst({ t, dur: CONFIG.BLAST_NOISE_DUR, sweep: CONFIG.BLAST_NOISE_SWEEP, peak: 1.1 * v, type: 'bandpass', f0: 1800 * j, f1: 250 * j, q: 1.2 });
    osc({ type: 'sine', f0: 120 * j, f1: 38 * j, sweep: 0.09, dur: CONFIG.BLAST_SINE_DUR, peak: CONFIG.BLAST_SINE_PEAK * v, t });
    osc({ type: 'triangle', f0: 55 * j, f1: 45 * j, sweep: 0.1, dur: CONFIG.BLAST_TRI_DUR, peak: 0.5 * v, t });
    duck(CONFIG.MUSIC_DUCK, CONFIG.MUSIC_DUCK_T);
  };
  // chk-chk: two filtered clicks 90 ms apart, the second lower = "ready"
  S.pump = () => {
    const v = voice('pump'); if (!v) return; const t = ac.currentTime, j = jit();
    noiseBurst({ t, dur: 0.035, peak: 0.55 * v, type: 'bandpass', f0: 2600 * j, q: 2.5 });
    osc({ type: 'square', f0: 900 * j, f1: 600 * j, dur: 0.04, peak: 0.12 * v, t });
    const t2 = t + 0.09;
    noiseBurst({ t: t2, dur: 0.045, peak: 0.6 * v, type: 'bandpass', f0: 1500 * j, q: 2.5 });
    osc({ type: 'square', f0: 620 * j, f1: 380 * j, dur: 0.06, peak: 0.14 * v, t: t2 });
  };
  S.shellIn = () => { const v = voice('shell'); if (!v) return; const t = ac.currentTime, j = jit(); noiseBurst({ t, dur: 0.025, peak: 0.35 * v, type: 'bandpass', f0: 1200 * j, q: 1.5 }); osc({ type: 'sine', f0: 520 * j, f1: 340 * j, dur: 0.04, peak: 0.18 * v, t }); };
  S.tink = () => { const v = voice('tink'); if (!v) return; const t = ac.currentTime, j = jit(); osc({ type: 'sine', f0: 3200 * j, f1: 2600 * j, dur: 0.07, peak: 0.12 * v, t }); osc({ type: 'sine', f0: 4800 * j, f1: 4100 * j, dur: 0.04, peak: 0.05 * v, t }); };
  S.hit = () => { const v = voice('hit'); if (!v) return; const t = ac.currentTime, j = jit(); osc({ type: 'square', f0: 220 * j, f1: 90 * j, dur: 0.06, peak: 0.28 * v, t }); noiseBurst({ t, dur: 0.02, peak: 0.25 * v, type: 'bandpass', f0: 1400 * j, q: 1 }); };
  // one death sound pitched by mass: Yorick tok (0.5), Restless splat (1), Gravedigger thud (4)
  S.death = (mass = 1) => {
    const v = voice('death'); if (!v) return; const t = ac.currentTime, j = jit(), k = Math.sqrt(Math.max(0.25, mass));
    noiseBurst({ t, dur: 0.16 * k, sweep: 0.12 * k, peak: 0.7 * v, type: 'lowpass', f0: (900 / k) * j, f1: (120 / k) * j, q: 1 });
    osc({ type: 'sine', f0: (170 / k) * j, f1: (45 / k) * j, sweep: 0.1 * k, dur: 0.16 * k, peak: 0.6 * v, t });
    if (mass < 0.75) osc({ type: 'triangle', f0: 1400 * j, f1: 500 * j, dur: 0.04, peak: 0.3 * v, t });
  };
  S.thud = () => { const v = voice('thud'); if (!v) return; const t = ac.currentTime, j = jit(); osc({ type: 'sine', f0: 95 * j, f1: 32 * j, sweep: 0.12, dur: 0.22, peak: 0.9 * v, t }); noiseBurst({ t, dur: 0.14, sweep: 0.1, peak: 0.5 * v, type: 'lowpass', f0: 600 * j, f1: 150 * j, q: 1 }); };
  // dissonant organ stab + two heartbeats
  S.hurt = () => {
    const v = voice('hurt'); if (!v) return; const t = ac.currentTime;
    osc({ type: 'sawtooth', f0: 220, f1: 200, sweep: 0.3, dur: 0.35, peak: 0.22 * v, t });
    osc({ type: 'sawtooth', f0: 233, f1: 215, sweep: 0.3, dur: 0.35, peak: 0.22 * v, t });
    osc({ type: 'sine', f0: 70, f1: 45, dur: 0.12, peak: 0.6 * v, t: t + 0.05 });
    osc({ type: 'sine', f0: 70, f1: 45, dur: 0.12, peak: 0.5 * v, t: t + 0.3 });
  };
  // the blessing lands: a detuned major chord, voices entering one after another
  S.choir = () => {
    const v = voice('choir'); if (!v) return; const t = ac.currentTime, root = 392;
    const ratios = [1, 1.26, 1.5, 2];
    for (let i = 0; i < ratios.length; i++) {
      const t0 = t + i * 0.05, f = root * ratios[i];
      osc({ type: 'sine', f0: f, dur: 1.2 - i * 0.1, peak: (0.26 - i * 0.04) * v, t: t0 });
      osc({ type: 'triangle', f0: f * 1.004, dur: 1.0 - i * 0.1, peak: (0.09 - i * 0.015) * v, t: t0 });

  };
  // the Ghost arrives behind you: an airy swell so the ambush is heard even when it is not seen
  S.ghost = () => {
    const v = voice('ghost'); if (!v) return; const t = ac.currentTime, j = jit();
    noiseBurst({ t, dur: 0.5, sweep: 0.4, peak: 0.22 * v, type: 'bandpass', f0: 400 * j, f1: 2400 * j, q: 3 });
    osc({ type: 'sine', f0: 330 * j, f1: 660 * j, sweep: 0.4, dur: 0.5, peak: 0.1 * v, t });
    osc({ type: 'sine', f0: 331.5 * j, f1: 664 * j, sweep: 0.4, dur: 0.5, peak: 0.09 * v, t });
  };
  // last heart: a lub-dub under everything (juice §13.15)

    const v = voice('heartbeat'); if (!v) return; const t = ac.currentTime;
    noiseBurst({ t, dur: 0.14, peak: 0.18 * v, type: 'lowpass', f0: 160, f1: 60, q: 1 });
    osc({ type: 'sine', f0: 78, f1: 42, sweep: 0.1, dur: 0.17, peak: 0.55 * v, t });

    const v = voice('gameover'); if (!v) return; const t = ac.currentTime;

      osc({ type: 'sawtooth', f0: f, f1: f * 0.5, sweep: 1.1, dur: 1.4, peak: 0.2 * v, t });
      osc({ type: 'sawtooth', f0: f * 1.01, f1: f * 0.505, sweep: 1.1, dur: 1.4, peak: 0.16 * v, t });
    }
    osc({ type: 'sine', f0: 165, dur: 2.2, peak: 0.3 * v, t: t + 0.35 });
    osc({ type: 'sine', f0: 331, dur: 1.4, peak: 0.12 * v, t: t + 0.35 });
  };
  S.bell = (mult = 1) => {
    const v = voice('bell'); if (!v) return; const t = ac.currentTime, f = 660 * mult;
    osc({ type: 'sine', f0: f, dur: 1.4, peak: 0.35 * v, t }); osc({ type: 'sine', f0: f * 2.01, dur: 0.9, peak: 0.15 * v, t }); osc({ type: 'sine', f0: f * 2.98, dur: 0.5, peak: 0.08 * v, t });
  };
  function toggleMute() {

    try { if (master) master.gain.setTargetAtTime(muted ? 0 : MASTER, ac.currentTime, 0.02); } catch (e) { /* ignore */ }

  for (const k in S) api[k] = (...a) => { try { S[k](...a); } catch (e) { /* audio must never break the game */ } };
  api._S = S; api._osc = osc; api._noise = noiseBurst; api._voice = voice; api._duck = duck; api._jit = jit; api._ctx = () => ac;

// ---------------------------------------------------------------- MUSIC (spec §12, last row)
// A minor-key organ pedal drone (two detuned saws -> lowpass) under TITLE and the card screen; a
// scheduled 16th-note triangle arpeggio over i-VI-III-VII joins in PLAYING, its lowpass cutoff and
// note density climbing with the wave. Own gain into the same compressor, ~12 dB under the sfx bus,
// ducked on every shot. It schedules nothing while paused, muted, or with the context suspended,
// and it owns exactly two long-lived oscillators, torn down after MUSIC_IDLE seconds of silence.
const Music = (() => {
  // i · VI · III · VII in A minor, voiced close together so the figure walks instead of leaping
  const CHORDS = [[0, 3, 7, 12], [-4, 0, 3, 8], [3, 7, 10, 15], [-2, 2, 5, 10]];
  const ARP = [0, 1, 2, 3, 2, 1, 2, 3];  // the figure walked inside each chord
  let ac = null, bus = null, built = false, mode = 'off', offAt = 0, wave = 1;
  let droneOscA = null, droneOscB = null, droneFilter = null, droneGain = null, arpFilter = null, arpGain = null;
  let step = 0, bar = 0, nextT = 0;
  const hz = (semi) => CONFIG.MUSIC_ROOT * Math.pow(2, semi / 12);
  function build() {
    ac = Audio._ctx(); bus = Audio._musicBus();
    if (!ac || !bus) return false;
    droneFilter = ac.createBiquadFilter(); droneFilter.type = 'lowpass'; droneFilter.frequency.value = CONFIG.MUSIC_DRONE_CUT; droneFilter.Q.value = 0.7;
    droneGain = ac.createGain(); droneGain.gain.value = 0.0001;
    droneFilter.connect(droneGain); droneGain.connect(bus);
    const f = CONFIG.MUSIC_ROOT * CONFIG.MUSIC_DRONE_MUL;
    droneOscA = ac.createOscillator(); droneOscA.type = 'sawtooth'; droneOscA.frequency.value = f; droneOscA.detune.value = -CONFIG.MUSIC_DETUNE;
    droneOscB = ac.createOscillator(); droneOscB.type = 'sawtooth'; droneOscB.frequency.value = f; droneOscB.detune.value = CONFIG.MUSIC_DETUNE;
    droneOscA.connect(droneFilter); droneOscB.connect(droneFilter);
    droneOscA.start(); droneOscB.start();
    arpFilter = ac.createBiquadFilter(); arpFilter.type = 'lowpass'; arpFilter.frequency.value = CONFIG.MUSIC_CUT_BASE; arpFilter.Q.value = CONFIG.MUSIC_CUT_Q;
    arpGain = ac.createGain(); arpGain.gain.value = 0.0001;
    arpFilter.connect(arpGain); arpGain.connect(bus);
    built = true; step = 0; bar = 0; nextT = 0;
    return true;
  }
  // kill every node this module owns: nothing survives a newGame() or a long silence
  function teardown() {
    for (const o of [droneOscA, droneOscB]) { if (!o) continue; try { o.stop(); } catch (e) { /* already stopped */ } try { o.disconnect(); } catch (e) { /* ignore */ } }
    for (const n of [droneFilter, droneGain, arpFilter, arpGain]) { if (n) try { n.disconnect(); } catch (e) { /* ignore */ } }
    droneOscA = droneOscB = droneFilter = droneGain = arpFilter = arpGain = null;
    built = false; nextT = 0; step = 0; bar = 0;
  }
  const cutoff = () => Math.min(CONFIG.MUSIC_CUT_MAX, CONFIG.MUSIC_CUT_BASE + CONFIG.MUSIC_CUT_PER * Math.max(0, wave - 1));
  const density = () => Math.min(CONFIG.MUSIC_DENS_MAX, CONFIG.MUSIC_DENS_BASE + CONFIG.MUSIC_DENS_PER * Math.max(0, wave - 1));
  // one triangle note: its oscillator stops itself, so the graph never grows
  function note(f, t) {
    const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(f, t);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(CONFIG.MUSIC_NOTE_GAIN, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + CONFIG.MUSIC_NOTE_T);
    o.connect(g); g.connect(arpFilter); o.start(t); o.stop(t + CONFIG.MUSIC_NOTE_T + 0.02);
  }
  function scheduleStep(t) {
    const ch = CHORDS[bar % CHORDS.length];
    const down = step % 4 === 0;
    if (!down && Math.random() > density()) return;
    const semi = ch[ARP[step % ARP.length] % ch.length] + CONFIG.MUSIC_ARP_OCT * 12;
    note(hz(semi), t);
    if (down && step === 0) note(hz(ch[0] + (CONFIG.MUSIC_ARP_OCT - 1) * 12), t);
  }
  function set(m, waveN) {
    if (waveN) wave = waveN;
    if (m === mode) return;
    mode = m;
    if (m === 'off' && ac) offAt = ac.currentTime;
  }
  function update() {
    try {
      if (mode !== 'off' && !built && !build()) return;
      if (!built) return;
      if (!Audio.running) { nextT = 0; return; }   // no context, suspended, muted or paused: schedule nothing
      const t = ac.currentTime, tc = CONFIG.MUSIC_FADE / 3;
      droneGain.gain.setTargetAtTime(mode === 'off' ? 0.0001 : CONFIG.MUSIC_DRONE_GAIN, t, tc);
      arpGain.gain.setTargetAtTime(mode === 'play' ? 1 : 0.0001, t, tc);
      arpFilter.frequency.setTargetAtTime(cutoff(), t, 0.3);
      if (mode !== 'play') { nextT = 0; if (mode === 'off' && t - offAt > CONFIG.MUSIC_IDLE) teardown(); return; }
      const sixteenth = 60 / CONFIG.MUSIC_BPM / 4;
      if (nextT < t) { nextT = t + 0.05; step = 0; }   // first note, or back from a suspend: restart the bar
      while (nextT < t + CONFIG.MUSIC_LOOKAHEAD) {
        scheduleStep(nextT);
        nextT += sixteenth;
        step++;
        if (step >= CONFIG.MUSIC_STEPS) { step = 0; bar++; }
      }
    } catch (e) { /* music is optional; never break the frame */ }
  }
  function stop() { try { set('off'); teardown(); } catch (e) { /* ignore */ } }
  return { set, update, stop, get mode() { return mode; }, get live() { return built; } };
})();

// ===================================================================== SPRITES
// The Designer's procedural recipes (docs/jam/art/sprites-scratch.html), lifted.
// Pivot: (x, y) is the FEET (bottom-centre) unless noted; s = scale, 1 = in-game size.
// All geometry is in local units, so ctx.scale(s) scales the 2 px ink outline too.
// These numbers are ART, not tuning: they live here beside the recipes, never in CONFIG.

// the ground shadow is baked out of the pre-rendered bodies (a white silhouette must not
// include it, and squash/stretch must not scale it), so the world draws it at blit time
let SPR_SHADOWS = true;
function shadow(c, x, y, rx, ry) {
  if (!SPR_SHADOWS) return;
  c.fillStyle = PAL.shadow; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU); c.fill();
}
function drawShadow(c, x, y, rx, ry) { c.fillStyle = PAL.shadow; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU); c.fill(); }
// outlined thick line (limbs): ink underlay then colour
function limb(c, x1, y1, x2, y2, w, colour) {
  c.lineCap = 'round';
  c.lineWidth = w + 3; c.strokeStyle = PAL.ink; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  c.lineWidth = w; c.strokeStyle = colour; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  c.lineCap = 'butt';
}

// ---------------------------------------------------------------- THE NUN
// o = { facing: 1|-1, lean: radians around the feet, walk: 0|1, shadow: bool }
// Height ~31 px at s=1 (feet to veil top). Hand pivot for the gun: NUN_HAND.
const NUN_HAND = { x: 2.5, y: -14.5 };
function drawNun(c, x, y, s, o) {
  o = o || {};
  const facing = o.facing || 1, walk = o.walk || 0;
  c.save();
  c.translate(x, y);
  c.scale(s * facing, s);
  if (o.shadow !== false) shadow(c, 0, 0, 9, 3);
  c.rotate(o.lean || 0);
  c.lineJoin = 'round';
  // shoes
  const step = walk ? 1.5 : 0;
  rrect(c, -7 + step, -3.2, 5.5, 3.2, 1.2, PAL.shoe, PAL.ink, 1);
  rrect(c, 1.5 - step, -3.2, 5.5, 3.2, 1.2, PAL.shoe, PAL.ink, 1);
  // veil (behind everything): cap over the head, trailing to the shoulders
  c.beginPath();
  c.moveTo(-9, -12);
  c.quadraticCurveTo(-10.2, -22, -7.6, -26.8);
  c.quadraticCurveTo(-3.6, -31.4, 0, -31.4);
  c.quadraticCurveTo(3.6, -31.4, 7.6, -26.8);
  c.quadraticCurveTo(10.2, -22, 9, -12);
  c.quadraticCurveTo(0, -10, -9, -12);
  c.closePath();
  c.fillStyle = PAL.habit; c.fill(); c.lineWidth = 2; c.strokeStyle = PAL.ink; c.stroke();
  // habit: bell
  c.beginPath();
  c.moveTo(-5.2, -18.5); c.lineTo(5.2, -18.5);
  c.quadraticCurveTo(9, -11, 9.8, -1.5);
  c.quadraticCurveTo(0, 0.6, -9.8, -1.5);
  c.quadraticCurveTo(-9, -11, -5.2, -18.5);
  c.closePath();
  c.fillStyle = PAL.habit; c.fill(); c.lineWidth = 2; c.strokeStyle = PAL.ink; c.stroke();
  // habit highlight (light from upper-left)
  c.beginPath();
  c.moveTo(-4.4, -17.5);
  c.quadraticCurveTo(-7.6, -11, -8.2, -2.8);
  c.lineTo(-5.6, -2.6);
  c.quadraticCurveTo(-5.6, -11, -2.4, -17.5);
  c.closePath();
  c.fillStyle = PAL.habitHi; c.fill();
  // scapular strip
  rrect(c, -2.1, -17.8, 4.2, 15.3, 0.6, PAL.bone, PAL.ink, 1);
  // gold cross
  c.fillStyle = PAL.gold;
  c.fillRect(-0.75, -15.6, 1.5, 5.2);
  c.fillRect(-2.4, -14.2, 4.8, 1.5);
  // coif ring (white, wider than the head) — THE nun silhouette
  ell(c, 0, -22, 6.7, 7, PAL.bone, PAL.ink, 2);
  // face
  ell(c, 0, -21.6, 3.9, 4.7, PAL.skin);
  // eyes + deadpan mouth
  c.fillStyle = PAL.eye;
  c.fillRect(-2.4, -22.9, 1.5, 1.7);
  c.fillRect(0.9, -22.9, 1.5, 1.7);
  c.fillRect(-0.8, -19.4, 1.6, 0.8);
  c.restore();
}

// ---------------------------------------------------------------- THE SHOTGUN
// (x, y) = pivot at the nun's hand. angle in radians. pumpOffset 0..1 racks the block 5 px back.
// Muzzle at local (GUN_MUZZLE, 0). Too long on purpose: 38.5 px at s=1 (~1.25x the nun).
const GUN_MUZZLE = 28;
function drawGun(c, x, y, s, angle, pumpOffset) {
  c.save();
  c.translate(x, y);
  c.scale(s, s);
  c.rotate(angle);
  if (Math.cos(angle) < 0) c.scale(1, -1);   // keep the stock hanging down when aiming left
  c.lineJoin = 'round';
  // stock
  c.beginPath();
  c.moveTo(-1, -2); c.lineTo(-1, 2.2); c.lineTo(-10, 4.6); c.lineTo(-10.5, 1); c.closePath();
  c.fillStyle = PAL.stock; c.fill(); c.lineWidth = 2; c.strokeStyle = PAL.ink; c.stroke();
  c.strokeStyle = PAL.stockHi; c.lineWidth = 1; c.beginPath(); c.moveTo(-2, -0.6); c.lineTo(-9, 1.6); c.stroke();
  // rear hand at the grip
  ell(c, 0.5, 2, 2, 1.7, PAL.skin, PAL.ink, 1);
  // receiver
  rrect(c, -2, -2.4, 10, 4.8, 1, PAL.gunDark, PAL.ink, 2);
  // barrel
  rrect(c, 7, -1.6, GUN_MUZZLE - 7, 3.2, 0.6, PAL.gunDark, PAL.ink, 2);
  c.fillStyle = PAL.gunHi; c.fillRect(8, -1.4, GUN_MUZZLE - 9, 1);
  // muzzle cap
  rrect(c, GUN_MUZZLE - 2, -2.1, 2.4, 4.2, 0.6, PAL.pump, PAL.ink, 1.5);
  // pump block + front hand
  const px = 13 - 5 * (pumpOffset || 0);
  rrect(c, px, -2.6, 7, 5.2, 1, PAL.pump, PAL.ink, 2);
  ell(c, px + 3.5, 1.6, 2.1, 1.7, PAL.skin, PAL.ink, 1);
  c.restore();
}

// ---------------------------------------------------------------- THE RESTLESS (and the Ghost body)
// frame 0|1 = 2-frame walk. ~26 px tall. Faces +x; flip with scale(-1, 1) around the feet.
function drawRestlessBody(c, frame, pal, ghost) {
  c.lineJoin = 'round';
  if (!ghost) {
    shadow(c, 0, 0, 8, 2.6);
    // legs: apart / together
    const xs = frame ? [-3.2, -0.2] : [-5.5, 1.5];
    for (const lx of xs) {
      rrect(c, lx, -7.5, 3, 7.5, 1, pal.shade, PAL.ink, 1.5);
      rrect(c, lx - 0.5, -1.8, 4.2, 1.8, 0.6, PAL.shoe, PAL.ink, 1);
    }
  } else {
    // wavy floating hem instead of legs
    const w = frame ? 1.5 : -1.5;
    c.beginPath();
    c.moveTo(-6.2, -6);

// ---------------------------------------------------------------- composition
// Gun OVER the body when aiming down (sin >= 0), UNDER when aiming up. Body flips when cos < 0.
function drawNunWithGun(c, x, y, s, angle, pumpOffset, o) {
  o = Object.assign({}, o || {});
  const facing = Math.cos(angle) < 0 ? -1 : 1;
  o.facing = facing;
  const hx = x + NUN_HAND.x * s * facing, hy = y + NUN_HAND.y * s;
  if (Math.sin(angle) >= 0) { drawNun(c, x, y, s, o); drawGun(c, hx, hy, s, angle, pumpOffset); }
  else { drawGun(c, hx, hy, s, angle, pumpOffset); drawNun(c, x, y, s, o); }
}

// ---------------------------------------------------------------- pre-render
// Every body is drawn ONCE at boot into an offscreen canvas at 2x (both frames), plus a white
// `source-in` silhouette for hit flashes. The world blits them with drawImage; nothing here runs per frame.
const SPR_K = 2;
// w/h = the local-space box, ax/ay = the FEET pivot inside it, sx/sy = the ground shadow radii,
// foot = how far the feet sit below the entity's collision centre.
const SPRITE_BOX = {
  nun: { w: 26, h: 38, ax: 13, ay: 35, sx: 9, sy: 3, foot: 14, draw: (c, x, y, f) => drawNun(c, x, y, 1, { facing: 1, walk: f }) },
  restless: { w: 34, h: 34, ax: 14, ay: 31, sx: 8, sy: 2.6, foot: 12, draw: (c, x, y, f) => drawRestless(c, x, y, 1, f) },
  ghost: { w: 38, h: 36, ax: 17, ay: 32, sx: 0, sy: 0, foot: 12, alpha: 0.5, draw: (c, x, y, f) => drawGhost(c, x, y, 1, f) },
  yorick: { w: 20, h: 20, ax: 10, ay: 18, sx: 5, sy: 1.7, foot: 7, draw: (c, x, y, f) => drawYorick(c, x, y, 1, f) },
  gravedigger: { w: 56, h: 68, ax: 26, ay: 64, sx: 17, sy: 5, foot: 22, draw: (c, x, y, f) => drawGravedigger(c, x, y, 1, f) },
  claudius: { w: 152, h: 180, ax: 74, ay: 176, sx: 51, sy: 15, foot: 52, draw: (c, x, y, f) => drawClaudius(c, x, y, 1, f) },
};
const SPR = {};
function buildSprites() {
  SPR_SHADOWS = false;
  for (const key in SPRITE_BOX) {
    const b = SPRITE_BOX[key], img = [], white = [];
    for (let f = 0; f < 2; f++) {
      const cv = makeCanvas(Math.ceil(b.w * SPR_K), Math.ceil(b.h * SPR_K));
      const c = cv.getContext('2d');
      c.setTransform(SPR_K, 0, 0, SPR_K, 0, 0);
      b.draw(c, b.ax, b.ay, f);
      img.push(cv);
      const wv = makeCanvas(cv.width, cv.height), wc = wv.getContext('2d');
      wc.drawImage(cv, 0, 0);
      wc.globalCompositeOperation = 'source-in';
      wc.fillStyle = '#ffffff'; wc.fillRect(0, 0, wv.width, wv.height);
      white.push(wv);
    }
    SPR[key] = { img, white, box: b };
  }
  SPR_SHADOWS = true;
}
// blit a pre-rendered body: o = { face, sx, sy, rot, white }
function blitBody(c, key, frame, x, feetY, o) {
  const s = SPR[key]; if (!s) return;
  const b = s.box, img = (o && o.white) ? s.white[frame & 1] : s.img[frame & 1];
  c.save();
  c.translate(x, feetY);
  if (o && o.rot) c.rotate(o.rot);
  c.scale(((o && o.sx) || 1) * ((o && o.face) || 1), (o && o.sy) || 1);
  c.drawImage(img, -b.ax, -b.ay, b.w, b.h);
  c.restore();
}

// ---------------------------------------------------------------- the nun in the world
const NUN_FOOT = SPRITE_BOX.nun.foot;   // feet below her collision centre
const VEIL_ANCHOR = 24, VEIL_LAG = 0.4, VEIL_W = 6.5;   // the trail hangs off the back of the coif
const NUN_LEAN = 900, NUN_STRETCH = 0.18, NUN_SQUASH = 0.14, NUN_WALK_HZ = 8;
const PICKUP_HEART_S = 1.7, HUD_HEART_S = 1.7, HUD_PIP_S = 1.6;
function drawVeilTrail(c, p) {
  const ax = p.x, ay = p.y + NUN_FOOT - VEIL_ANCHOR, v = p.veil;
  if (Math.abs(v[2].x - ax) + Math.abs(v[2].y - ay) < 1.5) return;   // standing still: nothing to trail
  const pts = [{ x: ax, y: ay }, v[0], v[1], v[2]];
  const left = [], right = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    const [nx, ny] = norm(-(b.y - a.y), b.x - a.x);
    const w = VEIL_W * (1 - i / (pts.length - 1)) + 0.6;
    left.push([pts[i].x + nx * w, pts[i].y + ny * w]);
    right.push([pts[i].x - nx * w, pts[i].y - ny * w]);
  }
  c.beginPath();
  c.moveTo(left[0][0], left[0][1]);
  for (let i = 1; i < left.length; i++) c.lineTo(left[i][0], left[i][1]);
  for (let i = right.length - 1; i >= 0; i--) c.lineTo(right[i][0], right[i][1]);
  c.closePath();
  c.fillStyle = PAL.habit; c.fill();
  c.lineWidth = 1.5; c.strokeStyle = PAL.ink; c.lineJoin = 'round'; c.stroke();
}
// pre-rendered body, procedural gun: the gun rotates to aim, over the body when aiming down and
// under when aiming up; the body flips when the aim crosses vertical (the Designer's drawNunWithGun rule).
function drawNunSprite(c, p) {
  const feetY = p.y + NUN_FOOT;
  const facing = Math.cos(p.aim) < 0 ? -1 : 1;
  const frame = p.moving ? Math.floor(p.walkT * NUN_WALK_HZ) & 1 : 0;
  drawVeilTrail(c, p);
  // a cream ring on the flagstones: her footprint stays readable with a body standing on it
  c.strokeStyle = rgba(PAL.cream, CONFIG.NUN_RING_A); c.lineWidth = CONFIG.NUN_RING_LW;
  c.beginPath(); c.ellipse(p.x, feetY, CONFIG.NUN_RING_RX, CONFIG.NUN_RING_RY, 0, 0, TAU); c.stroke();
  drawShadow(c, p.x, feetY, SPRITE_BOX.nun.sx, SPRITE_BOX.nun.sy);
  const st = p.stretch || 0;
  c.save();
  c.translate(p.x, feetY);
  c.rotate(clamp(p.kvx / NUN_LEAN, -0.35, 0.35));                                   // lean into the recoil
  if (st > 0.01) { c.rotate(p.aim); c.scale(1 + st * NUN_STRETCH, 1 - st * NUN_SQUASH); c.rotate(-p.aim); }
  const pump = clamp((p.gunSlide || 0) / CONFIG.GUN_SLIDE_PX, 0, 1);
  const body = () => blitBody(c, 'nun', frame, 0, 0, { face: facing });
  const gun = () => drawGun(c, NUN_HAND.x * facing, NUN_HAND.y, 1, p.aim, pump);
  if (Math.sin(p.aim) >= 0) { body(); gun(); } else { gun(); body(); }
  c.restore();
}

// ===================================================================== FX
// Particles ring buffer (fillRect only), camera shake/kick, muzzle flashes, pops, screen flashes.
const FX = (() => {
  const N = CONFIG.PARTICLES;
  const px = new Float32Array(N), py = new Float32Array(N), vx = new Float32Array(N), vy = new Float32Array(N);
  const life = new Float32Array(N), maxLife = new Float32Array(N), size = new Float32Array(N), grav = new Float32Array(N), drag = new Float32Array(N);
  const color = new Array(N).fill(PAL.bone);
  let cursor = 0, aliveCount = 0;
  function spawn(x, y, vx_, vy_, life_, col, sz, g = 0, dr = 0.92) {
    const i = cursor; cursor = (cursor + 1) % N;
    px[i] = x; py[i] = y; vx[i] = vx_; vy[i] = vy_; life[i] = maxLife[i] = life_; color[i] = col; size[i] = sz; grav[i] = g; drag[i] = dr;
  }
  function burst(x, y, n, opts) {
    for (let k = 0; k < n; k++) {
      const a = opts.angle !== undefined ? opts.angle + (Math.random() - 0.5) * (opts.arc || TAU) : Math.random() * TAU;

// Floor: persistent offscreen canvas at 2x. Flagstones drawn once; decals and stopped casings stamped onto it.
const Floor = (() => {
  const S = 2; let cv, fc;
  function build() {
    cv = makeCanvas(CONFIG.W * S, CONFIG.H * S); fc = cv.getContext('2d'); fc.setTransform(S, 0, 0, S, 0, 0);
    fc.fillStyle = PAL.floor; fc.fillRect(0, 0, CONFIG.W, CONFIG.H);
    fc.strokeStyle = PAL.stone; fc.lineWidth = 2;
    const cw = 48, ch = 32;
    for (let y = CONFIG.BORDER; y < CONFIG.H; y += ch) {
      fc.beginPath(); fc.moveTo(0, y); fc.lineTo(CONFIG.W, y); fc.stroke();
      const off = (Math.floor(y / ch) % 2) * (cw / 2);

function updatePlayer(dt) {
  const p = G.player;
  // aim
  const [ax, ay, ad] = norm(Input.mouse.x - p.x, Input.mouse.y - p.y);
  p.aimX = ax; p.aimY = ay; p.aimDist = ad; p.aim = Math.atan2(ay, ax); p.facing = ax < 0 ? -1 : 1;
  // move + knock
  const [mx, my] = Input.axis(); const moving = mx !== 0 || my !== 0; const [nx, ny] = norm(mx, my);
  p.moving = moving; if (moving) p.walkT += dt;
  p.x += ((moving ? nx * CONFIG.NUN_SPEED : 0) + p.kvx) * dt;
  p.y += ((moving ? ny * CONFIG.NUN_SPEED : 0) + p.kvy) * dt;
  p.kvx *= CONFIG.FRICTION; p.kvy *= CONFIG.FRICTION;
  // clamp to the arena; kill knock velocity into the wall
  const B = CONFIG.BORDER + p.r;
  if (p.x < B) { p.x = B; if (p.kvx < 0) p.kvx = 0; } else if (p.x > CONFIG.W - B) { p.x = CONFIG.W - B; if (p.kvx > 0) p.kvx = 0; }
  if (p.y < B) { p.y = B; if (p.kvy < 0) p.kvy = 0; } else if (p.y > CONFIG.H - B) { p.y = CONFIG.H - B; if (p.kvy > 0) p.kvy = 0; }
  if (p.iframes > 0) p.iframes -= dt;
  p.stretch *= 0.82; p.gunKick *= 0.78;
  // veil: a 3-link chain lagging behind the head anchor
  let hx = p.x, hy = p.y + NUN_FOOT - VEIL_ANCHOR;
  for (const v of p.veil) { v.x = lerp(v.x, hx, VEIL_LAG); v.y = lerp(v.y, hy, VEIL_LAG); hx = v.x; hy = v.y; }

  p.gunSlideV += (-CONFIG.SLIDE_K * p.gunSlide - CONFIG.SLIDE_DAMP * p.gunSlideV) * dt;
  p.gunSlide += p.gunSlideV * dt;
  updateGun(dt);
}

// gun state machine: READY / PUMPING / LOADING. Hold LMB to fire at pump rate; a shot is allowed mid-reload the moment one shell is in.
function updateGun(dt) {
  const p = G.player, g = p.gun, s = p.stats;
  // a button already held when PLAYING begins (title click, card pick) must not fire until released once
  if (!Input.mouse.down) g.holdBlock = false;
  // a tap in the last FIRE_BUFFER_T of the pump (or of the shell going in) is remembered and fires the instant the gun is ready
  if (Input.mouse.justDown && g.state !== 'READY' && g.timer <= CONFIG.FIRE_BUFFER_T) g.buffered = true;
  const wantFire = Input.mouse.justDown || (Input.mouse.down && !g.holdBlock) || g.buffered;
  if (g.state === 'READY') {
    if (wantFire && g.shells > 0) fire(); // fire() eats the buffer, so a buffered tap can never double up with the hold
    else { g.buffered = false; if (g.shells === 0 || (Input.pressed('KeyR') && g.shells < s.shells)) { g.state = 'LOADING'; g.timer = s.shellT; } }
  } else if (g.state === 'PUMPING') {
    g.timer -= dt;
    if (!g.pumped && g.timer <= s.pumpT * (1 - CONFIG.PUMP_SFX_AT)) { g.pumped = true; p.gunSlide = CONFIG.GUN_SLIDE_PX; p.gunSlideV = 0; Audio.pump(); }
    if (g.timer <= 0) { if (g.shells === 0) { g.state = 'LOADING'; g.timer = s.shellT; } else g.state = 'READY'; }
  } else if (g.state === 'LOADING') {
    if (wantFire && g.shells > 0) { fire(); return; }
    g.timer -= dt;
    if (g.timer <= 0) {
      g.shells++; p.gunSlide = CONFIG.GUN_SLIDE_PX * 0.6; p.gunSlideV = 0; Audio.shellIn();
      if (g.shells >= s.shells) g.state = 'READY'; else g.timer = s.shellT;
    }

}
// impulse (px/s) whose total travel under per-tick friction equals px: sum of v*TICK*f^k = v*TICK/(1-f)
const impulseFor = (px) => (px * (1 - CONFIG.FRICTION)) / CONFIG.TICK;
function fire() {

  g.shells--; g.state = 'PUMPING'; g.timer = s.pumpT; g.pumped = false; g.buffered = false; G.shots++;
  // THUNDERCLAP: every fourth shot hits twice as hard and shakes the courtyard
  const thunder = !!s.thunder && G.shots % CONFIG.THUNDER_EVERY === 0;
  const shot = { kills: 0, n: G.shots, knock: thunder ? CONFIG.THUNDER_KNOCK : 1, cx: 0, cy: 0, age: 0, queued: false };
  const mx = p.x + p.aimX * CONFIG.MUZZLE_OFF, my = p.y - 1 + p.aimY * CONFIG.MUZZLE_OFF;
  const spread = (s.spread * Math.PI) / 180, n = s.pellets;
  for (let i = 0; i < n; i++) {
    if (G.pellets.length >= CONFIG.MAX_PELLETS) break;
    const a = p.aim - spread / 2 + (spread * (i + Math.random())) / n; // stratified: one pellet jittered inside each slot
    const sp = s.pelletSpeed * (1 + rand(-CONFIG.PELLET_SPEED_JITTER, CONFIG.PELLET_SPEED_JITTER)); // a spray, not a comb of tracers
    const age0 = CONFIG.MUZZLE_OFF / sp; // life and damage falloff are measured from the nun, not the muzzle, so the range numbers hold
    G.pellets.push({ x: mx, y: my, px: mx, py: my, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, age: age0, life: s.pelletLife, full: s.fullT, r: CONFIG.PELLET_R, pierce: s.pierce, bounces: s.bounce, hit: [], shot });
  }

  FX.shake(thunder ? CONFIG.THUNDER_SHAKE : CONFIG.SHAKE_FIRE_PX, CONFIG.SHAKE_FIRE_T);
  FX.kick(-p.aimX * CONFIG.KICK_PX, -p.aimY * CONFIG.KICK_PX);

}
function updatePellets(dt) {
  const B = CONFIG.BORDER, W = CONFIG.W, H = CONFIG.H, ps = G.pellets, es = G.enemies;
  for (let i = ps.length - 1; i >= 0; i--) {
    const b = ps[i];
    b.px = b.x; b.py = b.y; b.x += b.vx * dt; b.y += b.vy * dt; b.age += dt;
    let dead = b.age >= b.life;
    if (!dead && (b.x < B || b.x > W - B || b.y < B || b.y > H - B)) {
      if (b.bounces > 0) {
        b.bounces--;
        if (b.x < B || b.x > W - B) { b.vx = -b.vx; b.x = clamp(b.x, B, W - B); }
        if (b.y < B || b.y > H - B) { b.vy = -b.vy; b.y = clamp(b.y, B, H - B); }
      } else {
        dead = true;
        FX.burst(clamp(b.x, B, W - B), clamp(b.y, B, H - B), 2, { minSpeed: 30, maxSpeed: 120, minLife: 0.1, maxLife: 0.25, color: PAL.muzzle, minSize: 1.5, maxSize: 2.5 });
      }
    }
    if (!dead) {

        const e = es[k]; if (e.dead || b.hit.indexOf(e) >= 0) continue;
        const t = clamp(((e.x - b.px) * sx + (e.y - b.py) * sy) / len2, 0, 1);

}
function drawPellets(c) {

// brass casings: eject sideways with a fake height, one bounce and a tink, then stamped onto the floor
function spawnCasing(p) {

  const side = p.facing >= 0 ? 1 : -1;
  const perpX = -p.aimY * side, perpY = p.aimX * side;
  const ex = p.x + p.aimX * 8 + perpX * 4, ey = p.y - 4 + p.aimY * 8 + perpY * 4;

function updateCasings(dt) {
  const cs = G.casings;
  for (let i = cs.length - 1; i >= 0; i--) {
    const k = cs[i]; k.t += dt;
    k.vz -= 700 * dt; k.z += k.vz * dt; k.x += k.vx * dt; k.y += k.vy * dt; k.rot += k.vr * dt;
    let done = false;
    if (k.z <= 0) {

function stampCasing(k) {

// enemies: flat objects, all circles. Straight-at-you steering, one-pass separation, knockback under per-tick friction.
// Each type keys a pre-rendered sprite of the same name in SPR; `shade` is its gore/decal tone.
const ENEMY_DEFS = {

// how many points one burst may spend: the wave's share, capped by a ceiling that opens up as the

function startWave(n) {

function updateWaves(dt) {

// locked until earned (spec §8); 'hardhabit' is an unlock but not a card
const LOCKED_BLESSINGS = ['wrath', 'ricochet', 'thunderclap'];

  while (out.length < CONFIG.CARDS_N) out.push(blessingById('grace'));

function drawPlayerReticle(c) {
  const p = G.player, m = Input.mouse;
  const killRange = p.stats.pelletSpeed * p.stats.fullT + 12;
  let hot = false;
  // hot means "this shot kills that body": in range AND inside the cone, not merely near her
  const cosLimit = Math.cos(((p.stats.spread / 2 + CONFIG.RETICLE_HOT_PAD_DEG) * Math.PI) / 180);
  for (const e of G.enemies) {
    if (e.dead) continue;
    const d = Math.hypot(e.x - p.x, e.y - p.y);
    if (d >= killRange + e.r) continue;
    const [ex, ey] = norm(e.x - p.x, e.y - p.y);
    if (ex * p.aimX + ey * p.aimY > cosLimit) { hot = true; break; }
  }
  drawReticle(c, m.x, m.y, p.aimDist, hot, p.stats.spread / 2);
}

function hudData() {

STATES.PLAYING = {
  enter() { Input.endTick(); G.player.gun.holdBlock = true; },
  update(dt) {
    if (Input.pressed('Escape') || Input.pressed('KeyP')) { setState('PAUSED'); return; }
    G.t += dt;
    updatePlayer(dt);
    updatePellets(dt);
    updateEnemies(dt);
    if (G.state !== 'PLAYING') return;   // contact damage killed her: the rest of the tick is not ours
    updateCasings(dt);
    updatePickups(dt);
    FX.update(dt);
    updateTexts(dt);
    updateWaves(dt);
    updateSpawner(dt);
    resolveShots(dt);
    if (G.waveCardT > 0) G.waveCardT -= dt;
    if (G.comboT > 0) { G.comboT -= dt; if (G.comboT <= 0) G.chain = 0; }
    // last heart: a lub-dub and a breath of red at the edges until she picks one up (juice §13.15)
    const pl = G.player;
    if (pl.hp > 0 && pl.hp <= CONFIG.HEARTBEAT_HP && !pl.god) {
      G.beatT -= dt;
      if (G.beatT <= 0) { G.beatT = CONFIG.HEARTBEAT_T; Audio.heartbeat(); FX.beat(); }
    } else G.beatT = 0;
    // the multiplier pops whenever it changes
    const m = comboMult() * encoreMult() * hardMult();
    if (Math.abs(m - G.lastMult) > 1e-6) { G.lastMult = m; G.multPopT = 0; } else G.multPopT += dt;
  },
  draw(c) {
    drawWorld(c);
    FX.drawOverlays(c);
    drawHUD(c, hudData());
    if (G.waveCardT > 0) drawWaveCard(c, CONFIG.WAVE_CARD_T - G.waveCardT, waveName(G.wave), waveSub(G.wave));

  },
};

  toScreen(x, y) { return { x: View.offsetX + x * View.scale, y: View.offsetY + y * View.scale }; },
  toLogical(x, y) { return { x: (x - View.offsetX) / View.scale, y: (y - View.offsetY) / View.scale }; },
  startRun() { startRun(); return G.state; },
  skipToWave(n) {
    if (G.state !== 'PLAYING') startRun();
    G.enemies.length = 0; G.pellets.length = 0; G.pickups.length = 0;
    startWave(n); return G.wave;
  },
  spawn(type, n) { if (typeof type === 'number') { n = type; type = 'restless'; } if (n === undefined) n = 1; spawnClump(type || 'restless', n | 0); return G.enemies.length; },
  spawnAt(type, x, y, hp) { const e = spawnEnemy(type || 'restless', +x, +y); if (e && hp > 0) e.hp = e.maxHp = +hp; return e ? e.id : 0; },
  killAll() { const shot = { kills: 0 }; for (const e of G.enemies.slice()) if (!e.dead) killEnemy(e, shot); return G.enemies.length; },
  forceCards() { if (G.state === 'PLAYING' || G.state === 'PAUSED') setState('UPGRADE'); return G.state; },
  get cards() { return G.cards.map((b) => b.id); },
  get cardNames() { return G.cards.map((b) => b.name); },
  get picks() { return Object.assign({}, G.picks); },
  get stats() { return Object.assign({}, G.player.stats); },
  get unlocks() { return (Save.data.unlocks || []).slice(); },
  get newUnlocks() { return (G.newUnlocks || []).slice(); },
  get hard() { return G.hard; },
  get hardArmed() { return Opt.hard; },
  get hardUnlocked() { return hardUnlocked(); },
  pickCard(i) { return chooseCard(i | 0); },
  hoverCard(i) { G.cardHover = i | 0; return G.cardHover; },
  unlock(id) { const s = Save.data; if (!Array.isArray(s.unlocks)) s.unlocks = []; if (s.unlocks.indexOf(id) < 0) s.unlocks.push(id); Save.save(); return s.unlocks.slice(); },
  setHard(b) { Opt.hard = !!b; return Opt.hard; },
  setGod(b) { G.player.god = !!b; return G.player.god; },
  setTimeScale(x) { G.baseTimeScale = clamp(+x || 0, 0, 4); if (G.slowmoT <= 0) G.timeScale = G.baseTimeScale; return G.timeScale; },
  snapshot() {
    return {
      state: G.state, wave: G.wave, act: waveName(G.wave), score: G.score, hp: G.player.hp, maxHp: G.player.maxHp,
      shells: G.player.gun.shells, maxShells: G.player.stats.shells, gun: G.player.gun.state, enemies: G.enemies.length, pellets: G.pellets.length,
      particleCount: FX.alive(), fps: Perf.fps, frameMs: Perf.frameMs, timeScale: G.timeScale, god: G.player.god, hiScore: Save.data.hi,
      combo: comboMult(), chain: G.chain, kills: G.kills, hitstop: G.hitstop, version: VERSION,
      budget: G.budget, spent: G.spent, telegraphs: G.telegraphs.length, pickups: G.pickups.length,
      bossHp: GAME.bossHp, encore: G.wave > CONFIG.BOSS_WAVE, multiplier: comboMult() * encoreMult() * hardMult(),
      cards: G.cards.map((b) => b.id), picks: Object.assign({}, G.picks), unlocks: (Save.data.unlocks || []).slice(), hard: G.hard,
      player: { x: G.player.x, y: G.player.y, aim: G.player.aim }, audio: Audio.running, muted: Audio.muted,
    };
  },
};
window.GAME = GAME;

// ===================================================================== MAIN
function safeUpdate(dt) {
  try {
    debugKeys();
    STATES[G.state].update(dt);
  } catch (err) {
    console.error('update failed', err);
    try { if (G.state !== 'GAMEOVER') setState('GAMEOVER'); } catch (e2) { /* nothing left to do */ }
  }
  Input.endTick();
}
function draw() {
  const s = View.scale * View.dpr;
  ctx.setTransform(s, 0, 0, s, 0, 0);
  ctx.fillStyle = PAL.floor; ctx.fillRect(0, 0, CONFIG.W, CONFIG.H);
  try { STATES[G.state].draw(ctx); } catch (err) { console.error('draw failed', err); }
  drawDebug(ctx);
}
let last = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const t0 = performance.now();
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0) || dt > CONFIG.DT_CLAMP) dt = Math.min(Math.max(dt, 0), CONFIG.DT_CLAMP);
  // fps
  RT += dt;
  Perf._frames++; Perf._acc += dt; if (Perf._acc >= 0.5) { Perf.fps = Perf._frames / Perf._acc; Perf._frames = 0; Perf._acc = 0; }
  // render-time systems: shake, kick, flashes, slow-mo timer, the music scheduler
  FX.tickRender(dt);
  Music.set(G.state === 'PLAYING' ? 'play' : G.state === 'TITLE' || G.state === 'UPGRADE' ? 'drone' : 'off', G.wave);
  Music.update();
  if (G.slowmoT > 0) { G.slowmoT -= dt; if (G.slowmoT <= 0) G.timeScale = G.baseTimeScale; }
  // wave-end and boss-death slow-mo run on render time, so 0.4 s means 0.4 s no matter how slow the sim is
  if (G.state === 'PLAYING') {
    if (G.waveEndT > 0) { G.waveEndT -= dt; if (G.waveEndT <= 0) finishWave(); }
    else if (G.winT > 0) { G.winT -= dt; if (G.winT <= 0) finishBoss(); }
  }
  acc += dt * G.timeScale;
  let steps = 0;
  while (acc >= CONFIG.TICK && steps < CONFIG.MAX_STEPS) {
    acc -= CONFIG.TICK; steps++;
    if (G.state === 'PLAYING' && G.hitstop > 0) { G.hitstop--; continue; } // sim frozen, input buffered
    safeUpdate(CONFIG.TICK);
  }
  if (steps >= CONFIG.MAX_STEPS) acc = 0;
  draw();
  Perf.frameMs = Perf.frameMs * 0.9 + (performance.now() - t0) * 0.1;
}
function boot() {
  Save.load(); Audio.setMuted(Save.data.mute);
  G = newGame();
  FX.prerender(); buildSprites(); Floor.build(); resize();
  setState('TITLE');
  requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });
}
boot();
</script>
